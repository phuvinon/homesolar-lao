<style>

.ev .t{font-size:12px;color:var(--cu);font-weight:700;letter-spacing:.05em}.ev h3{font-size:15.5px;font-weight:700;margin:3px 0 2px;line-height:1.35}.ev p{font-size:12.5px;color:var(--mut)}

input[type=text],input[type=number]{width:100%;border:1px solid var(--line);border-radius:16px;padding:12px 14px;font:600 16px inherit;font-family:inherit;background:var(--card);color:var(--ink);margin-bottom:10px;outline:none}
input:focus{border-color:var(--cu)}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:8;display:none}.sheetbg.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:#151517;border-top:1px solid var(--line);border-radius:30px 30px 0 0;padding:18px 18px 24px;z-index:9;transform:translateY(105%);transition:transform .25s}.sheet.on{transform:none}

.done-t{text-decoration:line-through;color:var(--mut)}

.bx2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:14px 0 8px}.bx{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px}.bx small{font-size:12px;color:var(--mut)}.bx b{display:block;font-size:28px;font-weight:800;margin-top:2px}

.br{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}.br>span:first-child{width:62px;flex:none;color:var(--mut)}.br .tr{flex:1;height:10px;background:#26262A;border-radius:99px;overflow:hidden}.br .tr i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cu),var(--cb));box-shadow:0 0 10px rgba(232,147,95,.4)}.br b{width:34px;text-align:right;flex:none}

function pay(k){var o=k[0]==='j'?jobs.filter(function(j){return 'j'+j.id===k})[0]:bills[+k.slice(1)],a=k[0]==='j'?o.price-o.paid:o.t-o.paid;
 sheet('<h2>💰 ຮັບເງິນ</h2><div class="kv"><span>ຄ້າງຢູ່</span><b style="color:var(--rd)">'+money(a)+' ກີບ</b></div><input type="number" id="pa" inputmode="numeric" placeholder="ຈຳນວນເງິນທີ່ຮັບ" value="'+a+'" style="margin-top:12px"><button class="btn l" onclick="pay2(\''+k+'\')">✅ ບັນທຶກ</button>')}
function pay2(k){var n=Math.max(0,Math.round(Number($('pa').value)||0));if(!n){toast('ໃສ່ຈຳນວນເງິນ');return}
 var o=k[0]==='j'?jobs.filter(function(j){return 'j'+j.id===k})[0]:bills[+k.slice(1)];o.paid=Math.min(o.paid+n,k[0]==='j'?o.price:o.t);closeSheet();toast('💰 ຮັບເງິນ '+money(n)+' ແລ້ວ');render()}
function vNotes(){return head('ຈົດໄວ້','ໂນດຕິດຕາມ','','menu')+'<div style="display:flex;gap:8px;margin-top:14px"><input type="text" id="nt" placeholder="ຈົດສິ່ງທີ່ຕ້ອງຕິດຕາມ..."><button class="btn" style="height:48px;padding:0 18px;font-size:22px" onclick="addN()">＋</button></div>'
 +notes.map(function(n,i){return '<div class="li"><div class="ck '+(n.done?'on':'')+'" onclick="notes['+i+'].done=!notes['+i+'].done;render()">'+(n.done?'✓':'')+'</div><div style="flex:1"><h4 class="'+(n.done?'done-t':'')+'">'+n.t+'</h4>'+(n.imp&&!n.done?'<span class="chip cl">⭐ ສຳຄັນ</span>':'')+'</div></div>'}).join('')}
function addN(){var v=$('nt').value.trim();if(!v){toast('ພິມກ່ອນ');return}notes.unshift({t:v,done:false});render()}
function sheet(h){$('sheet').innerHTML=h;$('bg').classList.add('on');$('sheet').classList.add('on')}
function closeSheet(){$('bg').classList.remove('on');$('sheet').classList.remove('on')}
(function(){var p=new URLSearchParams(location.search),v=p.get('v');if(v)view=v;render();if(p.get('sheet')){builder(p.get('sheet'));cq(0,1);cq(2,1)}if(p.get('job'))openJob(+p.get('job'))})();
</script></body></html>
