<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ສະໝຸດເງິນ · PHUSIRI</title>
<meta name="theme-color" content="#0A1322">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ສະໝຸດເງິນ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#151a23;--muted:#667085;--line:#e4e7ec;--navy:#0A1322;--gold:#F6C453;
  --green:#12a150;--red:#dc2626;--blue:#2563eb;--amber:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Noto Sans Lao','Phetsarath OT',system-ui,sans-serif;color:var(--ink);font-size:15px;line-height:1.5;padding-bottom:84px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
header{background:var(--navy);color:#fff;padding:12px 16px 10px;position:sticky;top:0;z-index:40}
.hrow{display:flex;align-items:center;gap:8px;max-width:860px;margin:0 auto}
.brand{flex:1;min-width:0}.brand b{display:block;font-size:17px;font-weight:800}.brand small{color:var(--gold);font-size:12px}
.chip{background:#1f2a3d;color:#fff;border:0;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.seg{display:flex;background:#1f2a3d;border-radius:99px;padding:3px;max-width:860px;margin:8px auto 0}
.seg button{flex:1;border:0;background:none;color:#cbd5e1;border-radius:99px;padding:5px 8px;font-size:13.5px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--gold);color:var(--navy)}
.demo{background:#fff7d6;color:#7a5a00;font-size:12.5px;text-align:center;padding:6px 12px;border-bottom:1px solid #f1e3a6}
main{max-width:860px;margin:0 auto;padding:14px 14px 0}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:45;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:11.5px;color:var(--muted);cursor:pointer}
nav.tabs button i{display:block;font-style:normal;font-size:20px;line-height:1.3}
nav.tabs button.on{color:var(--navy);font-weight:800}
.fab{position:fixed;right:16px;bottom:84px;width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);color:var(--navy);font-size:30px;font-weight:800;box-shadow:0 6px 18px rgba(10,19,34,.3);cursor:pointer;z-index:44}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.kpi .n{font-size:20px;font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi.g .n{color:var(--green)}.kpi.r .n{color:var(--red)}.kpi.b .n{color:var(--blue)}
.sec{margin:16px 2px 8px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:8px}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.toolbar h2{flex:1;font-size:16.5px;text-align:center}
.nb{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:700}
.empty{color:var(--muted);font-size:13.5px;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center}
.pend{background:#fff7e6;border:1px solid #fcd9a0;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.pend b{color:#8a5a00}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.tx{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.tx .ic{font-size:20px;width:28px;text-align:center}
.tx .mid{flex:1;min-width:0}.tx .nm{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--green)}.amt.out{color:var(--red)}.amt.x{color:var(--blue)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:99px;background:#fff1d6;color:#8a5a00}
.dayh{display:flex;justify-content:space-between;padding:8px 2px 4px;font-weight:800;font-size:13.5px}
.dayh small{color:var(--muted);font-weight:600}
.brow{display:grid;grid-template-columns:minmax(80px,40%) 1fr auto;gap:8px;align-items:center;padding:6px 0;font-size:13.5px;border-bottom:1px solid #f1f2f5}
.brow:last-child{border-bottom:0}
.brow .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:10px;background:#eef1f5;border-radius:4px;overflow:hidden;position:relative}
.bf{display:block;height:100%;background:var(--navy);border-radius:4px}
.bf.over{background:var(--red)}
.brow .bv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.brow .bv small{display:block;color:var(--muted);font-size:11px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}th{font-size:11.5px;color:var(--muted);font-weight:600}
.wal{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:6px}
.wal .mid{flex:1}.wal .bal{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.ov{position:fixed;inset:0;background:rgba(10,19,34,.55);z-index:60;display:none}.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:94vh;overflow-y:auto;background:var(--bg);z-index:61;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .22s ease;max-width:860px;margin:0 auto}
.sheet.on{transform:none}
.shd{position:sticky;top:0;background:var(--navy);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;z-index:2;border-radius:18px 18px 0 0}
.shd b{flex:1;font-size:16px}
.x{background:#1f2a3d;border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.sbody{padding:14px 14px 40px}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:10px 0 4px}
.inp{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:10px 11px;background:#fff}
.inp:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.big{font-size:28px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.kseg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kseg button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 4px;font-weight:800;cursor:pointer}
.kseg button.on.out{border-color:var(--red);background:#fef2f2;color:var(--red)}
.kseg button.on.in{border-color:var(--green);background:#ecfdf3;color:var(--green)}
.kseg button.on.xfer{border-color:var(--blue);background:#eff6ff;color:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:13.5px;cursor:pointer}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chips .gh{width:100%;font-size:12px;color:var(--muted);font-weight:700;margin-top:4px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;font-size:15px}
.btn.pri{background:var(--navy);color:#fff}.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#fff;border:1px solid var(--line)}.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}
.btn.full{width:100%}.btns{display:flex;gap:8px;margin-top:14px}.btns .btn{flex:1}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;display:none;max-width:90vw;text-align:center}
.toast.err{background:var(--red)}
.loading{position:fixed;inset:0;background:rgba(243,244,247,.6);z-index:80;display:none;align-items:center;justify-content:center}.loading.on{display:flex}
.spin{width:38px;height:38px;border:4px solid #d0d5dd;border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.who{max-width:360px;margin:40px auto;text-align:center}.who h2{font-size:20px;margin-bottom:4px}.who p{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.pinp{font-size:26px;letter-spacing:10px;text-align:center}
.muted{color:var(--muted);font-size:13px}
.photo{width:100%;max-height:320px;object-fit:contain;border-radius:10px;background:#e5e7eb;margin-top:8px}
.ck{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line)}
.ck input{width:20px;height:20px;accent-color:var(--green)}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand"><b>💰 ສະໝຸດເງິນ</b><small id="sub">PHUSIRI · ບໍລິສັດ + ສ່ວນຕົວ</small></div>
    <button class="chip" onclick="refresh(true)">⟳</button>
    <button class="chip" id="meChip" style="display:none" onclick="logout()"></button>
  </div>
  <div class="seg" id="bookSeg" style="display:none"></div>
</header>
<div class="demo" id="demoBar" style="display:none">🧪 ໂໝດທົດລອງ — ຂໍ້ມູນຕົວຢ່າງ · PIN ເຈົ້າຂອງ 1234 · ຜູ້ຊ່ວຍ 5678</div>
<main id="app"></main>
<button class="fab" id="fab" style="display:none" onclick="openTx()">＋</button>
<nav class="tabs" id="tabs"></nav>
<div class="ov" id="ov" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spin"></div></div>
<input type="file" id="fileIn" accept="image/*" style="display:none">
<script>
/* ================= ພື້ນຖານ ================= */
var API_URL = 'https://script.google.com/macros/s/AKfycbxZZ_J_fGI3VpbFd3BDol-a_WfsvW3aMOOgplNEdQq-ExB5EAGvQqLxxms7iWrDKx5adg/exec'; // Apps Script MONEY_BOOK (mee50cent) · Deploy ໃໝ່ = ລິ້ງເດີມ (ແກ້ deployment ເກົ່າ)
var MODE = /^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && API_URL ? 'api' : 'demo';
var S = null, UI = { view: 'dash', book: 'co', month: '', q: '', wf: '' }, PIN = '';
var LS = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { } }, del: function (k) { try { localStorage.removeItem(k); } catch (e) { } } };
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { return Math.round(Number(n) || 0).toLocaleString('en-US'); }
function short(n) { n = Number(n) || 0; var a = Math.abs(n); return (n < 0 ? '−' : '') + (a >= 1e6 ? (a / 1e6).toFixed(a >= 1e8 ? 0 : 2).replace(/\.?0+$/, '') + 'M' : a >= 1e3 ? Math.round(a / 1e3) + 'K' : money(a)); }
function pad(n) { return ('0' + n).slice(-2); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return ymd(new Date()); }
var MON = ['ມັງກອນ', 'ກຸມພາ', 'ມີນາ', 'ເມສາ', 'ພຶດສະພາ', 'ມິຖຸນາ', 'ກໍລະກົດ', 'ສິງຫາ', 'ກັນຍາ', 'ຕຸລາ', 'ພະຈິກ', 'ທັນວາ'];
function monName(m) { var p = m.split('-'); return MON[Number(p[1]) - 1] + ' ' + p[0]; }
function addMonth(m, k) { var p = m.split('-'), d = new Date(Number(p[0]), Number(p[1]) - 1 + k, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function toast(m, err) { var t = $('toast'); t.textContent = m; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(function () { t.style.display = 'none'; }, 2600); }
function busy(on) { $('loading').classList.toggle('on', !!on); }
function openSheet() { $('ov').classList.add('on'); $('sheet').classList.add('on'); }
function closeSheet() { $('ov').classList.remove('on'); $('sheet').classList.remove('on'); }
function numOf(v) { return Number(String(v || '').replace(/[^\d]/g, '')) || 0; }
function fmtNum(el) { var n = numOf(el.value); el.value = n ? money(n) : ''; }

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var c = { pin: PIN };
    if (MODE === 'api') {
      var body = JSON.stringify({ fn: fn, args: [c].concat(args) });
      var post = function () { return fetch(API_URL, { method: 'POST', body: body }).then(function (r) { return r.json(); }); };
      var p = fn === 'api_getAll' ? post().catch(function () { return new Promise(function (ok) { setTimeout(ok, 1200); }).then(post); }) : post(); // ອ່ານ = ລອງຄືນ 1 ເທື່ອ · ຂຽນ = ຫ້າມລອງຊ້ຳ
      p.then(function (o) { if (o.error) rej(new Error(o.error)); else res(JSON.parse(o.result)); }).catch(function (e) { rej(e && e.message ? e : new Error('ເຊື່ອມຕໍ່ບໍ່ໄດ້ — ກວດອິນເຕີເນັດ')); });
    } else setTimeout(function () { try { res(JSON.parse(MOCK[fn].apply(null, [c].concat(args)))); } catch (e) { rej(e); } }, 120);
  });
}
function act() {
  var a = arguments; busy(true);
  return call.apply(null, a).then(function (d) { busy(false); apply(d); return d; }).catch(function (e) { busy(false); toast('⚠️ ' + e.message, true); throw e; });
}
function apply(d) {
  if (d.needSetup) { S = null; return renderSetup(); }
  S = d; if (S.role !== 'owner') UI.book = 'co';
  if (!UI.month) UI.month = (S.today || today()).slice(0, 7);
  render();
}
function refresh(show) {
  if (!PIN && MODE === 'api') return renderLogin();
  if (show) busy(true);
  return call('api_getAll').then(function (d) { busy(false); apply(d); if (show) toast('ອັບເດດແລ້ວ ✓'); })
    .catch(function (e) { busy(false); if (/PIN/.test(e.message)) { PIN = ''; LS.del('mb_pin'); renderLogin(); } toast('⚠️ ' + e.message, true); });
}

/* ================= ເຂົ້າລະບົບ ================= */
function renderLogin() {
  bare();
  $('app').innerHTML = '<div class="who"><h2>🔒 ໃສ່ PIN</h2><p>ເຈົ້າຂອງ ຫຼື ຜູ້ຊ່ວຍ</p><input class="inp pinp" id="pinIn" type="password" inputmode="numeric" maxlength="8" onkeydown="if(event.key===\'Enter\')login()">' +
    '<button class="btn pri full" style="margin-top:12px" onclick="login()">ເຂົ້າ</button></div>';
  setTimeout(function () { $('pinIn') && $('pinIn').focus(); }, 50);
}
function login() { PIN = $('pinIn').value.trim(); if (!PIN) return; LS.set('mb_pin', PIN); refresh(true); }
function logout() { PIN = ''; LS.del('mb_pin'); S = null; renderLogin(); }
function renderSetup() {
  bare();
  $('app').innerHTML = '<div class="who"><h2>👑 ເປີດໃຊ້ຄັ້ງທຳອິດ</h2><p>ຕັ້ງ PIN ເຈົ້າຂອງ (ຕົວເລກ 4–8 ຫຼັກ) — ຈື່ໄວ້ໃຫ້ດີ</p>' +
    '<input class="inp pinp" id="p1" type="password" inputmode="numeric" maxlength="8" placeholder="PIN"><input class="inp pinp" id="p2" type="password" inputmode="numeric" maxlength="8" placeholder="ອີກເທື່ອ" style="margin-top:8px">' +
    '<button class="btn gold full" style="margin-top:12px" onclick="firstPin()">ຕັ້ງ PIN</button></div>';
}
function firstPin() {
  var a = $('p1').value.trim(), b = $('p2').value.trim();
  if (a !== b) return toast('PIN 2 ຊ່ອງບໍ່ກົງກັນ', true);
  busy(true); call('api_setFirstPin', a).then(function (d) { busy(false); PIN = a; LS.set('mb_pin', a); apply(d); }).catch(function (e) { busy(false); toast('⚠️ ' + e.message, true); });
}
function bare() { $('tabs').innerHTML = ''; $('fab').style.display = 'none'; $('meChip').style.display = 'none'; $('bookSeg').style.display = 'none'; }

/* ================= ຂໍ້ມູນ + ຄຳນວນ ================= */
function cat(id) { return (S.cats || []).filter(function (c) { return c.id === id; })[0]; }
function wal(id) { return (S.wallets || []).filter(function (w) { return w.id === id; })[0]; }
function wBook(id) { var w = wal(id); return w ? w.book : (id ? 'me' : ''); } // ກະເປົາທີ່ຜູ້ຊ່ວຍບໍ່ເຫັນ = ສ່ວນຕົວ
function grp(t) { var c = cat(t.cat); return c ? c.grp : ''; }
function catName(t) { if (t.masked && t.kind !== 'xfer') return '🏠 ຈ່າຍແທນສ່ວນຕົວ'; var c = cat(t.cat); return c ? c.name : '—'; }
function icon(name) { var m = String(name).match(/^(\S+)\s/); return m ? m[1] : '•'; }
function plain(name) { return String(name).replace(/^\S+\s/, ''); }
function inMonth(m) { return (S.tx || []).filter(function (t) { return t.status !== 'void' && t.date.indexOf(m) === 0; }); }
// ບັນຊີບໍລິສັດ ໃນເດືອນ m
function coCalc(m) {
  var r = { sales: 0, cogs: 0, opex: 0, draws: 0, stock: 0, debt: 0, loan: 0, capital: 0, byCat: {}, cin: 0, cout: 0, owed: 0, pend: 0 };
  inMonth(m).forEach(function (t) {
    var g = grp(t), wb = wBook(t.wallet), tb = wBook(t.toWallet);
    if (t.kind === 'in' && t.book === 'co') {
      if (g === 'sales' || g === 'other') { r.sales += t.amount; r.cogs += t.cost || 0; } else if (g === 'loan') r.loan += t.amount;
    }
    if (t.kind === 'out' && t.book === 'co') {
      if (g === 'fixed' || g === 'var') { r.opex += t.amount; r.byCat[t.cat] = (r.byCat[t.cat] || 0) + t.amount; }
      else if (g === 'stock') r.stock += t.amount; else if (g === 'debt') r.debt += t.amount;
      if (wb === 'me') r.owed += t.amount; // ເຈົ້າຂອງຈ່າຍແທນບໍລິສັດ
    }
    if (t.kind === 'out' && t.book === 'me' && wb === 'co') r.draws += t.amount; // ບໍລິສັດຈ່າຍແທນສ່ວນຕົວ
    if (t.kind === 'xfer') {
      if (g === 'salary') { r.opex += t.amount; r.byCat[t.cat] = (r.byCat[t.cat] || 0) + t.amount; }
      if (g === 'draw' && wb === 'co') r.draws += t.amount;
      if (g === 'capital' && tb === 'co') r.capital += t.amount;
    }
