<!DOCTYPE html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ຕາຕະລາງວຽກ · HOME SOLAR</title>
<!-- ໄອຄອນເວລາເພີ່ມລົງໜ້າຈໍໂຮມ (ໄຟລ໌ຢູ່ຄຽງຂ້າງ index.html ໃນ GitHub Pages) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="theme-color" content="#0A1322">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ຕາຕະລາງວຽກ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f7; --card:#fff; --ink:#151a23; --muted:#667085; --line:#e4e7ec;
  --navy:#0A1322; --gold:#F6C453; --gold-d:#a16207;
  --green:#12a150; --red:#dc2626; --blue:#2563eb; --amber:#d97706; --purple:#7c3aed; --gray:#6b7280;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Noto Sans Lao','Phetsarath OT','Saysettha OT',system-ui,sans-serif;color:var(--ink);
  font-size:15px;line-height:1.5;padding-bottom:84px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
header{background:var(--navy);color:#fff;padding:12px 16px 10px;position:sticky;top:0;z-index:40}
.hrow{display:flex;align-items:center;gap:8px;max-width:860px;margin:0 auto}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:.2px}
.brand small{color:var(--gold);font-size:12px}
.chip{background:#1f2a3d;color:#fff;border:0;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.gold{background:var(--gold);color:var(--navy);font-weight:700}
.demo{background:#fff7d6;color:#7a5a00;font-size:12.5px;text-align:center;padding:6px 12px;border-bottom:1px solid #f1e3a6}
main{max-width:860px;margin:0 auto;padding:14px 14px 0}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:45;
  padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;min-width:0;border:0;background:none;padding:8px 1px 10px;font-size:11px;color:var(--muted);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.tabs button i{display:block;font-style:normal;font-size:20px;line-height:1.3}
nav.tabs button.on{color:var(--navy);font-weight:800}
nav.tabs button.on i{transform:scale(1.1)}
.fab{position:fixed;right:16px;bottom:84px;width:58px;height:58px;border-radius:50%;border:0;background:var(--gold);
  color:var(--navy);font-size:30px;font-weight:800;box-shadow:0 6px 18px rgba(10,19,34,.3);cursor:pointer;z-index:44}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;cursor:pointer}
.kpi .n{font-size:24px;font-weight:800;line-height:1.2}
.kpi .l{font-size:11.5px;color:var(--muted)}
.kpi.red .n{color:var(--red)} .kpi.blue .n{color:var(--blue)} .kpi.amber .n{color:var(--amber)}
.sec{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-weight:800;font-size:15px}
.sec .cnt{background:var(--navy);color:#fff;border-radius:99px;font-size:11.5px;padding:1px 8px}
.sec.red{color:var(--red)} .sec.red .cnt{background:var(--red)}
.empty{color:var(--muted);font-size:13.5px;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center}
.job{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--tc,#94a3b8);border-radius:12px;
  padding:10px 12px;margin-bottom:8px;cursor:pointer;position:relative}
.job:active{background:#f8fafc}
.job.done{opacity:.62}
.job .top{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.job .top .t{font-weight:700;color:var(--ink)}
.job .nm{font-weight:700;font-size:15.5px;margin:2px 0}
.job .m{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.sp{flex:1}
.due{display:inline-block;margin-top:4px;background:#fff4dc;color:#8a5a00;font-size:12.5px;font-weight:700;border-radius:8px;padding:2px 8px}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.toolbar h2{flex:1;font-size:16.5px;text-align:center;min-width:140px}
.nb{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 14px;cursor:pointer;font-weight:700}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--navy)}
.day{margin-bottom:6px}
.dayh{display:flex;align-items:baseline;gap:8px;padding:8px 2px 6px;font-weight:800}
.dayh small{color:var(--muted);font-weight:400}
.dayh.today{color:var(--blue)}
.dayh .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.mgrid .wd{font-size:11.5px;color:var(--muted);text-align:center;padding:2px 0}
.cell{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:62px;padding:4px;cursor:pointer;overflow:hidden}
.cell.out{opacity:.35}
.cell.tdy{border:2px solid var(--blue)}
.cell.sel{background:#eef4ff;border-color:var(--blue)}
.cell .d{font-size:12.5px;font-weight:700}
.cell .dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:2px}
.cell .dot{width:8px;height:8px;border-radius:50%}
.cell .more{font-size:10.5px;color:var(--muted);font-weight:700}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;margin-bottom:8px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;white-space:nowrap;cursor:pointer}
.fchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:8px}
.money3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.money3 .kpi{cursor:default}
.money3 .kpi .n{font-size:17px}
/* sheet (detail / form) */
.ov{position:fixed;inset:0;background:rgba(10,19,34,.55);z-index:60;display:none}
.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:94vh;overflow-y:auto;background:var(--bg);z-index:61;
  border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .22s ease;max-width:860px;margin:0 auto}
.sheet.on{transform:none}
.shd{position:sticky;top:0;background:var(--navy);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;z-index:2;border-radius:18px 18px 0 0}
.shd b{flex:1;font-size:16px}
.x{background:#1f2a3d;border:0;color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.sbody{padding:14px 14px 40px}
.info{display:grid;grid-template-columns:28px 1fr;row-gap:6px;font-size:14.5px;align-items:start}
.info .k{font-size:16px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.abtn{display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:9px 4px;font-size:12.5px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.abtn i{font-style:normal;font-size:20px}
.stgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stbtn{border:2px solid transparent;border-radius:10px;padding:8px 4px;font-weight:700;font-size:13px;cursor:pointer}
.stbtn.on{border-color:var(--ink)}
.eq{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.eq:last-child{border-bottom:0}
.eq input{width:20px;height:20px;accent-color:var(--green);flex:none}
.eq.ok span{text-decoration:line-through;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e5e7eb;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:26px;height:26px;cursor:pointer}
.addph{aspect-ratio:1;border:2px dashed #cbd5e1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--muted);font-size:12px;cursor:pointer;background:#fff;text-align:center}
.addph i{font-style:normal;font-size:24px}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tl .it{position:relative;padding:4px 0 8px;font-size:13.5px}
.tl .it:before{content:'';position:absolute;left:-18px;top:10px;width:10px;height:10px;border-radius:50%;background:#cbd5e1}
.tl .it.note:before{background:var(--gold)}
.tl .it small{color:var(--muted);display:block;font-size:11.5px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
label.f{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin:10px 0 4px}
.inp{width:100%;border:1px solid #d0d5dd;border-radius:10px;padding:10px 11px;background:#fff}
textarea.inp{min-height:76px;resize:vertical}
.inp:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.tpick{display:flex;flex-wrap:wrap;gap:6px}
.tpick label{display:flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13.5px;cursor:pointer}
.tpick input{accent-color:var(--navy)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;font-size:15px}
.btn.pri{background:var(--navy);color:#fff}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca}
.btn.full{width:100%}
.btns{display:flex;gap:8px;margin-top:14px}
.btns .btn{flex:1}
.dlg{position:fixed;inset:0;background:rgba(10,19,34,.6);z-index:85;display:none;align-items:center;justify-content:center;padding:16px}
.dlg.on{display:flex}
.dlgc{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:360px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.dlgc b{display:block;font-size:17px}
.dlgc p{color:var(--muted);font-size:14px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;
  font-size:14px;z-index:90;display:none;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.err{background:var(--red)}
.loading{position:fixed;inset:0;background:rgba(243,244,247,.6);z-index:80;display:none;align-items:center;justify-content:center}
.loading.on{display:flex}
.spin{width:38px;height:38px;border:4px solid #d0d5dd;border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.who{max-width:420px;margin:30px auto;text-align:center}
.who h2{font-size:20px;margin-bottom:4px}
.who p{color:var(--muted);font-size:13.5px;margin-bottom:16px}
.who .btn{display:block;width:100%;margin-bottom:8px;text-align:left}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:95;display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:96vw;max-height:88vh;border-radius:8px}
.tech-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.tech-row .wide{grid-column:1/-1;display:flex;gap:6px}
.tech-row .wide input{flex:1}
.muted{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.brow{display:grid;grid-template-columns:minmax(70px,34%) 1fr auto;gap:8px;align-items:center;padding:5px 0;font-size:13.5px}
.brow .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:10px;background:#eef1f5;border-radius:4px;overflow:hidden}
.bf{display:block;height:100%;background:var(--navy);border-radius:4px}
.brow .bv{min-width:26px;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:420px){ .kpi .n{font-size:21px} .kpi .l{font-size:10.5px} }
@media (min-width:700px){ .acts{grid-template-columns:repeat(6,1fr)} }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="brand"><b>📋 ຕາຕະລາງວຽກ</b><small>HOME SOLAR · ຕິດຕັ້ງດອກໄຟ · ຮົ້ວ</small></div>
    <button class="chip" onclick="refresh(true)" title="ໂຫຼດໃໝ່">⟳</button>
    <button class="chip" id="setChip" style="display:none" onclick="go('settings')" title="ຕັ້ງຄ່າ">⚙️</button>
    <button class="chip" id="meChip" onclick="logout()"></button>
  </div>
</header>
<div class="demo" id="demoBar" style="display:none">🧪 ໂໝດທົດລອງ — ຂໍ້ມູນຕົວຢ່າງ ເກັບໄວ້ໃນເຄື່ອງນີ້ເທົ່ານັ້ນ · PIN ເຈົ້າຂອງ = 1234</div>

<main id="app"></main>

<button class="fab" id="fab" style="display:none" onclick="fabClick()">＋</button>
<nav class="tabs" id="tabs"></nav>

<div class="ov" id="ov" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="dlg" id="dlg"></div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spin"></div></div>
<div class="lb" id="lb" onclick="this.classList.remove('on')"><img id="lbImg" alt=""></div>
<input type="file" id="fileIn" accept="image/*" multiple style="display:none">
<input type="file" id="poFileIn" accept="image/*,application/pdf" multiple style="display:none">

<script>
/* ================= ພື້ນຖານ ================= */
var IS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
// ໂໝດ: gas = ເປີດຜ່ານລິ້ງ /exec · api = ເປີດຈາກ GitHub Pages ແລ້ວເອີ້ນ Apps Script ຜ່ານ POST · demo = ເປີດໄຟລ໌ໃນເຄື່ອງ
var API_URL = 'https://script.google.com/macros/s/AKfycbyY3gxcSZyVjwKXitjdOJkUrsV3YjSzh8NiHuM-FuZjI1ZA-9gFD03JYqMwO_xOPyGr4w/exec';
var MODE = IS_GAS ? 'gas' : (/^https?:$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'api' : 'demo');
var LS = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};
var ME = null; try { ME = JSON.parse(LS.get('js_me') || 'null'); } catch (e) { ME = null; }
var S = { owner: false, jobs: [], techs: [], types: [], logs: {}, reminders: [] };
var UI = { view: 'today', cursor: new Date(), mine: true, openId: null, sel: null, q: '', fs: '', ft: '', moneyCur: new Date(), loaded: false };

var STATUS = {
  pending:   { l: 'ລໍຖ້ານັດ', c: '#475467', bg: '#eaecf0' },
  scheduled: { l: 'ນັດແລ້ວ',  c: '#1d4ed8', bg: '#dbe7ff' },
  progress:  { l: 'ກຳລັງເຮັດ', c: '#a15c00', bg: '#fdecc8' },
  done:      { l: 'ສຳເລັດ',   c: '#067647', bg: '#d1fadf' },
  postponed: { l: 'ເລື່ອນ',    c: '#6d28d9', bg: '#ece4ff' },
  cancelled: { l: 'ຍົກເລີກ',   c: '#b42318', bg: '#fee4e2' }
};
var TCOL = ['#F59E0B', '#0EA5E9', '#8B5CF6', '#EF4444', '#10B981', '#64748B', '#EC4899', '#14B8A6'];
var DOW = ['ອາທິດ', 'ຈັນ', 'ອັງຄານ', 'ພຸດ', 'ພະຫັດ', 'ສຸກ', 'ເສົາ'];
var DOW_S = ['ອາ', 'ຈ', 'ອ', 'ພ', 'ພຫ', 'ສ', 'ສ'];
var MON = ['ມັງກອນ', 'ກຸມພາ', 'ມີນາ', 'ເມສາ', 'ພຶດສະພາ', 'ມິຖຸນາ', 'ກໍລະກົດ', 'ສິງຫາ', 'ກັນຍາ', 'ຕຸລາ', 'ພະຈິກ', 'ທັນວາ'];
var REM_OPTS = [[2880, 'ກ່ອນ 2 ມື້'], [1440, 'ກ່ອນ 1 ມື້'], [180, 'ກ່ອນ 3 ຊົ່ວໂມງ'], [60, 'ກ່ອນ 1 ຊົ່ວໂມງ'], [30, 'ກ່ອນ 30 ນາທີ']];

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { return Math.round(Number(n) || 0).toLocaleString('en-US'); }
function pad(n) { return (n < 10 ? '0' : '') + n; }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseYmd(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
function today() { return ymd(new Date()); }
function dLabel(s) { if (!s) return 'ຍັງບໍ່ນັດວັນ'; var d = parseYmd(s); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; }
function relDay(s) {
  if (!s) return ''; var t = today();
  if (s === t) return 'ມື້ນີ້'; if (s === ymd(addDays(new Date(), 1))) return 'ມື້ອື່ນ'; if (s === ymd(addDays(new Date(), -1))) return 'ມື້ວານ';
  return '';
}
function typeColor(t) { var i = S.types.indexOf(t); return i < 0 ? '#94a3b8' : TCOL[i % TCOL.length]; }
function techName(id) { var t = S.techs.filter(function (x) { return x.id === id; })[0]; return t ? t.name : '(ລຶບແລ້ວ)'; }
function activeTechs() { return S.techs.filter(function (t) { return t.active !== false; }); }
function jobById(id) { return S.jobs.filter(function (j) { return j.id === id; })[0]; }
function isOpen(j) { return j.status !== 'done' && j.status !== 'cancelled'; }
function isOverdue(j) { return j.date && j.date < today() && (j.status === 'scheduled' || j.status === 'progress'); }
function byTime(a, b) { return (a.date || '9999').localeCompare(b.date || '9999') || (a.start || '99').localeCompare(b.start || '99'); }
function visibleJobs() {
  if (S.owner || !UI.mine || !ME || ME.role !== 'tech') return S.jobs;
  return S.jobs.filter(function (j) { return j.techIds.indexOf(ME.id) >= 0; });
}
function mapLink(j) { return j.mapUrl || (j.location ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(j.location) : ''); }
function photoUrl(p, big) { return String(p).indexOf('data:') === 0 ? p : 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(p) + '&sz=w' + (big ? 1600 : 500); }

function toast(msg, err) {
  var t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, err ? 4500 : 2200);
}
function busy(on) { $('loading').classList.toggle('on', !!on); }

/* ================= ເອີ້ນເຊີບເວີ (ຫຼື ໂໝດທົດລອງ) ================= */
var LINK = null; // ລິ້ງວຽກທີ່ເຈົ້າຂອງແຊໃຫ້ຊ່າງ: { job, k } ຈາກ ?job=..&k=..
function isOwnerMe() { return !!(ME && ME.role === 'owner'); }
var FRESH = false;
function ctx() {
  var c = { pin: isOwnerMe() ? ME.pin : '', who: ME ? ME.name : '?', jobId: LINK ? LINK.job : '', key: LINK ? LINK.k : '' };
  if (FRESH) { c.fresh = 1; FRESH = false; } // ⟳ = ອ່ານໃໝ່ຈາກ Sheet (ບໍ່ເອົາແຄຊ)
  return c;
}
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (res, rej) {
    var done = function (r) { res(typeof r === 'string' ? JSON.parse(r) : r); };
    if (MODE === 'gas') {
      var runner = google.script.run.withSuccessHandler(done).withFailureHandler(function (e) { rej(e); });
      runner[fn].apply(runner, [ctx()].concat(args));
    } else if (MODE === 'api') {
      // body ເປັນ text ທຳມະດາ → ບໍ່ມີ CORS preflight
      // Google ບາງເທື່ອຕອບໜ້າ error ແທນ JSON (ຊົ່ວຄາວ) → ລອງໃໝ່ອັດຕະໂນມັດ 1 ຄັ້ງ
      // ສະເພາະຄຳສັ່ງອ່ານ — ຄຳສັ່ງຂຽນຫ້າມລອງຊ້ຳ (ເຊັ່ນ ຮັບເຄື່ອງ → ໃບນຳເຂົ້າ Pancake ຊ້ຳ)
      var body = JSON.stringify({ fn: fn, args: [ctx()].concat(args) });
      var post = function () { return fetch(API_URL, { method: 'POST', body: body }).then(function (r) { return r.json(); }); };
      var safe = fn === 'api_getAll' || fn === 'api_checkPin' || fn === 'api_getProducts';
      post().catch(function (e) { if (!safe) throw e; return new Promise(function (ok) { setTimeout(ok, 1200); }).then(post); })
        .then(function (o) { if (o.error) rej(new Error(o.error)); else done(o.result); })
        .catch(function () { rej(new Error('ເຊື່ອມຕໍ່ບໍ່ໄດ້ — ກວດອິນເຕີເນັດ ແລ້ວກົດ ⟳')); });
    } else {
      setTimeout(function () { try { done(MOCK[fn].apply(null, [ctx()].concat(args))); } catch (e) { rej(e); } }, 150);
    }
  });
}
function apply(d) {
  if (d.delta) { mergeDelta(d); if (d.warn) toast(d.warn, true); render(); return; }
  if (!d.products && S && S.products && d.owner) d.products = S.products; // ສິນຄ້າໂຫຼດແຍກ — ຮັກສາຂອງເກົ່າໄວ້
  S = d;
  if (ME && ME.role === 'owner' && !d.owner) { ME = null; LS.del('js_me'); toast('PIN ຖືກປ່ຽນ — ກະລຸນາເຂົ້າໃໝ່', true); }
  if (d.warn) toast(d.warn, true);
  render();
  if (S.owner && !S.products) loadProducts();
  if (S.owner) loadCRM();
}
/* ⚡ v12: ຫຼັງບັນທຶກ ເຊີບເວີສົ່ງຄືນສະເພາະວຽກທີ່ປ່ຽນ (delta) → ລວມເຂົ້າກັບຂໍ້ມູນທີ່ມີ ບໍ່ຕ້ອງໂຫຼດທັງໝົດ */
function mergeDelta(d) {
  (d.removed || []).forEach(function (id) { S.jobs = S.jobs.filter(function (j) { return j.id !== id; }); delete S.logs[id]; });
  (d.jobs || []).forEach(function (j) {
    var i = -1; S.jobs.forEach(function (x, k) { if (x.id === j.id) i = k; });
    if (i >= 0) S.jobs[i] = j; else S.jobs.push(j);
    S.logs[j.id] = (S.logs[j.id] || []).filter(function (l) { return !l.local; }); // ເອົາປະຫວັດຊົ່ວຄາວ (optimistic) ອອກ
  });
  (d.logs || []).forEach(function (l) { (S.logs[l.id] = S.logs[l.id] || []).push({ time: l.time, who: l.who, action: l.action, detail: l.detail }); });
  ['receipts', 'nextInvoice', 'fenceDocs'].forEach(function (k) { if (k in d) S[k] = d[k]; });
}
/* ສິນຄ້າ Pancake ໂຫຼດຢູ່ເບື້ອງຫຼັງ ຫຼັງເປີດແອບ (ບໍ່ໃຫ້ການເປີດແອບຊ້າ) */
var PROD_LOADING = false;
function loadProducts() {
  if (PROD_LOADING) return; PROD_LOADING = true;
  call('api_getProducts').then(function (r) {
    PROD_LOADING = false; S.products = r.products || [];
    if (!$('sheet').classList.contains('on')) render();
    else if ($('fEqList') && typeof jobEqRender === 'function') jobEqRender();
  }).catch(function () { PROD_LOADING = false; });
}
function act(fn) {
  var args = arguments; busy(true);
  return call.apply(null, args).then(function (d) { busy(false); apply(d); return d; })
    .catch(function (e) { busy(false); toast('⚠️ ' + (e && e.message ? e.message : e), true); throw e; });
}
/* ອັບເດດໜ້າຈໍທັນທີ ບໍ່ລໍຖ້າເຊີບເວີ (optimistic):
   mutate() ປ່ຽນຂໍ້ມູນໃນເຄື່ອງ → ສະແດງທັນທີ → ສົ່ງເຊີບເວີຢູ່ເບື້ອງຫຼັງ
   ຖ້າເຊີບເວີປະຕິເສດ → ແຈ້ງເຕືອນ + ໂຫຼດຂໍ້ມູນຈິງຄືນ */
var INFLIGHT = 0;
function nowLocal() { var d = new Date(); return ymd(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function addLocalLog(id, action, detail) { (S.logs[id] = S.logs[id] || []).push({ time: nowLocal(), who: ME ? ME.name : '?', action: action, detail: detail, local: true }); }
function optimistic(mutate, okMsg, fn) {
  var args = Array.prototype.slice.call(arguments, 3);
  try { mutate(); } catch (e) { return toast('⚠️ ' + e.message, true); }
  render(); if (okMsg) toast(okMsg);
  INFLIGHT++;
  return call.apply(null, [fn].concat(args)).then(function (d) {
    INFLIGHT--; if (d && d.delta) apply(d); else if (!INFLIGHT) apply(d); // delta ລວມໄດ້ທັນທີ · ຂໍ້ມູນທັງໝົດ: ໃຊ້ເມື່ອສົ່ງຄົບແລ້ວເທົ່ານັ້ນ
  }).catch(function (e) {
    INFLIGHT--; toast('⚠️ ບັນທຶກບໍ່ສຳເລັດ: ' + (e && e.message ? e.message : e) + ' — ໂຫຼດຂໍ້ມູນຄືນ', true); refresh();
  });
}
function refresh(show) {
  if (show) busy(true);
  FRESH = true;
  return call('api_getAll').then(function (d) { busy(false); UI.loaded = true; apply(d); if (show) toast('ອັບເດດແລ້ວ ✓'); })
    .catch(function (e) { busy(false); toast('⚠️ ໂຫຼດບໍ່ໄດ້: ' + (e && e.message ? e.message : e), true); });
}

/* ກ່ອງຖາມ/ຢືນຢັນຂອງແອບເອງ (ແທນ confirm/prompt ທີ່ບາງ browser/ມືຖືບລັອກ)
   opts: {title, msg, input:'pin'|'money'|undefined, value, ok, danger} → Promise(ຄ່າທີ່ພິມ | true | null) */
function ask(opts) {
  return new Promise(function (res) {
    var box = $('dlg');
    var inp = opts.input ? '<input class="inp" id="dlgIn" ' + (opts.input === 'pin' ? 'type="password" inputmode="numeric" autocomplete="off"' : opts.input === 'text' ? 'type="text"' : 'inputmode="numeric" oninput="fmtNum(this)"') +
      ' value="' + esc(opts.value || '') + '" style="margin-top:10px;font-size:18px;text-align:center">' : '';
    box.innerHTML = '<div class="dlgc"><b>' + esc(opts.title) + '</b>' + (opts.msg ? '<p>' + esc(opts.msg).replace(/\n/g, '<br>') + '</p>' : '') + inp +
      '<div class="btns"><button class="btn ghost" id="dlgNo">ຍົກເລີກ</button><button class="btn ' + (opts.danger ? 'danger' : 'pri') + '" id="dlgYes">' + esc(opts.ok || 'ຕົກລົງ') + '</button></div></div>';
    box.classList.add('on');
    var fin = function (v) { box.classList.remove('on'); box.innerHTML = ''; res(v); };
    $('dlgNo').onclick = function () { fin(null); };
    $('dlgYes').onclick = function () { fin(opts.input ? $('dlgIn').value.trim() : true); };
    box.onclick = function (e) { if (e.target === box) fin(null); };
    var i = $('dlgIn');
    if (i) { setTimeout(function () { i.focus(); i.select(); }, 50); i.onkeydown = function (e) { if (e.key === 'Enter') $('dlgYes').click(); }; }
  });
}

function card(j, showDate) {

  var time = j.start ? j.start + (j.end ? '–' + j.end : '') : 'ບໍ່ລະບຸເວລາ';
  var when = showDate ? (j.date ? (relDay(j.date) || dLabel(j.date)) + ' · ' + time : 'ຍັງບໍ່ນັດວັນ') : time;
  var techs = j.techIds.map(techName).join(', ');

function section(title, list, cls, showDate) {

  if (!list.length) return h + '<div class="empty">ບໍ່ມີວຽກ</div>';

/* ---------- ມື້ນີ້ ---------- */
function vToday() {
  var js = visibleJobs(), t = today(), tm = ymd(addDays(new Date(), 1));
  var over = js.filter(isOverdue).sort(byTime);
  var tdy = js.filter(function (j) { return j.date === t && j.status !== 'cancelled'; }).sort(byTime);
  var tmr = js.filter(function (j) { return j.date === tm && j.status !== 'cancelled'; }).sort(byTime);
  var wait = js.filter(function (j) { return j.status === 'pending' || j.status === 'postponed' || (!j.date && isOpen(j)); }).sort(byTime);
  var wk = js.filter(function (j) { return j.date > tm && j.date <= ymd(addDays(new Date(), 7)) && isOpen(j); }).sort(byTime);
  var d = new Date();

/* ---------- ອາທິດ ---------- */
function weekStart(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); var k = (x.getDay() + 6) % 7; return addDays(x, -k); }
function vWeek() {
  var s = weekStart(UI.cursor), e = addDays(s, 6), js = visibleJobs(), t = today();
  var title = s.getDate() + ' ' + MON[s.getMonth()] + ' – ' + e.getDate() + ' ' + MON[e.getMonth()];
  var h = '<div class="toolbar"><button class="nb" onclick="shift(-7)">‹</button><h2>' + title + '</h2><button class="nb" onclick="shift(7)">›</button></div>' +
    '<div class="toolbar"><button class="nb" onclick="UI.cursor=new Date();render()">ອາທິດນີ້</button><span class="sp"></span>' + mineToggle() + '</div>';
  var total = 0;
  for (var i = 0; i < 7; i++) {
    var d = addDays(s, i), ds = ymd(d);
    var list = js.filter(function (j) { return j.date === ds && j.status !== 'cancelled'; }).sort(byTime);
    total += list.length;
    h += '<div class="day"><div class="dayh' + (ds === t ? ' today' : '') + '">' + DOW[d.getDay()] + ' <small>' + d.getDate() + ' ' + MON[d.getMonth()] + (ds === t ? ' · ມື້ນີ້' : '') + '</small><span class="cnt">' + (list.length ? list.length + ' ວຽກ' : '') + '</span></div>' +
      (list.length ? list.map(function (j) { return card(j); }).join('') : '<div class="empty" style="padding:8px">ວ່າງ</div>') + '</div>';
  }
  return h;
}
function shift(n) { UI.cursor = addDays(UI.cursor, n); render(); }

/* ---------- ເດືອນ ---------- */
function vMonth() {
  var c = UI.cursor, y = c.getFullYear(), m = c.getMonth(), js = visibleJobs(), t = today();
  var first = new Date(y, m, 1), start = addDays(first, -((first.getDay() + 6) % 7));
  var h = '<div class="toolbar"><button class="nb" onclick="shiftM(-1)">‹</button><h2>' + MON[m] + ' ' + y + '</h2><button class="nb" onclick="shiftM(1)">›</button></div>' +
    '<div class="toolbar"><button class="nb" onclick="UI.cursor=new Date();UI.sel=today();render()">ເດືອນນີ້</button><span class="sp"></span>' + mineToggle() + '</div>';
  h += '<div class="mgrid">' + ['ຈັນ', 'ອັງຄານ', 'ພຸດ', 'ພະຫັດ', 'ສຸກ', 'ເສົາ', 'ອາທິດ'].map(function (x) { return '<div class="wd">' + x + '</div>'; }).join('');
  var monthCount = 0;
  for (var i = 0; i < 42; i++) {
    var d = addDays(start, i), ds = ymd(d);
    if (i === 35 && d.getMonth() !== m) break;
    var list = js.filter(function (j) { return j.date === ds && j.status !== 'cancelled'; });
    if (d.getMonth() === m) monthCount += list.length;
    var dots = list.slice(0, 6).map(function (j) { return '<span class="dot" style="background:' + typeColor(j.type) + (j.status === 'done' ? ';opacity:.35' : '') + '"></span>'; }).join('');
    h += '<div class="cell' + (d.getMonth() !== m ? ' out' : '') + (ds === t ? ' tdy' : '') + (ds === UI.sel ? ' sel' : '') + '" onclick="UI.sel=\'' + ds + '\';render()">' +
      '<div class="d">' + d.getDate() + '</div><div class="dots">' + dots + '</div>' + (list.length > 6 ? '<div class="more">+' + (list.length - 6) + '</div>' : (list.length ? '<div class="more">' + list.length + '</div>' : '')) + '</div>';
  }
  h += '</div>';
  h += '<div class="filters">' + S.types.map(function (tp) { return '<span class="fchip" style="cursor:default"><span class="dot" style="display:inline-block;width:9px;height:9px;border-radius:50%;background:' + typeColor(tp) + '"></span> ' + esc(tp) + '</span>'; }).join('') + '</div>';
  var sel = UI.sel || t;
  var sl = js.filter(function (j) { return j.date === sel && j.status !== 'cancelled'; }).sort(byTime);
  h += section('📌 ' + dLabel(sel), sl);
  h += '<p class="muted" style="margin-top:10px;text-align:center">ເດືອນນີ້ມີທັງໝົດ ' + monthCount + ' ວຽກ</p>';
  return h;
}

function saveSettings() {
  var types = $('setTypes').value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
  var rem = Array.prototype.slice.call(document.querySelectorAll('.remCb')).filter(function (c) { return c.checked; }).map(function (c) { return +c.value; });
  var pin = $('setPin').value.trim();
  if (pin && !/^\d{4,8}$/.test(pin)) return toast('PIN ຕ້ອງເປັນຕົວເລກ 4-8 ໂຕ', true);
  var keep = DRAFT_TECHS.filter(function (t) { return String(t.name).trim(); });
  var ids = keep.map(function (t) { return t.id; });
  var removed = S.techs.filter(function (t) { return ids.indexOf(t.id) < 0; }).map(function (t) { return { id: t.id, name: t.name, phone: t.phone, email: t.email, active: false }; });
  var sources = $('setSources').value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
  act('api_saveSettings', { techs: keep.concat(removed), types: types, sources: sources, reminders: rem, newPin: pin,
    instRate: num('setInst'), dayRate: num('setDay'), halfRate: num('setHalf') }).then(function () {
    if (pin) { ME.pin = pin; LS.set('js_me', JSON.stringify(ME)); }
    DRAFT_TECHS = null; render(); toast('ບັນທຶກແລ້ວ ✓');
  });
}

var FD_T = { quote: 'ໃບສະເໜີລາຄາ', deposit: 'ໃບຮັບເງິນມັດຈຳ', install: 'ໃບຮັບເງິນງວດ', full: 'ໃບເກັບເງິນ' };
var FD_SUB = { quote: 'Price Quotation', deposit: 'Deposit Receipt', install: 'Installment Receipt', full: 'Invoice / Receipt' };
var FD_IC = { quote: '📋', deposit: '💵', install: '💵', full: '🧾' };
var FD_SHORT = { quote: 'ສະເໜີ', deposit: 'ມັດຈຳ', install: 'ງວດ', full: 'ເກັບເງິນ' };
var FENCE_SHOP = { name: 'ພູສິຣິ ຕິດຕັ້ງຮົ້ວ', co: 'ບໍລິສັດ ພູສິຣິການຄ້າ ຂາອອກ-ຂາເຂົ້າ ຈຳກັດ', addr: 'ບ້ານຄຳສະຫວາດ ເມືອງໄຊເສດຖາ ນະຄອນຫຼວງວຽງຈັນ', tel: '020 58868589',
  bank: [['LAK', '010-1200-00334968-001'], ['THB', '013-1202-00334968-001'], ['ຊື່ບັນຊີ', 'PHUVINON BANNAVONG']], signer: 'PHUVINON BANNAVONG' };
var FD_TERMS = '• ມັດຈຳ 50% ກ່ອນເລີ່ມສັ່ງຜະລິດ/ຕິດຕັ້ງ, ຊຳລະສ່ວນທີ່ເຫຼືອເມື່ອສົ່ງມອບງານ\n• ຮັບປະກັນໂຄງສ້າງຮົ້ວ 10 ປີ\n• ໄລຍະເວລາຕິດຕັ້ງ: ແຈ້ງໃຫ້ຊາບຫຼັງຢືນຢັນພື້ນທີ່ ແລະ ຈຳນວນແທ້ຈິງ\n• ລາຄານີ້ອີງຕາມພື້ນທີ່/ແບບທີ່ແຈ້ງມາ ອາດປ່ຽນແປງໄດ້ຫາກໜ້າວຽກຈິງແຕກຕ່າງ';
function fdSer(k) { return k === 'quote' ? 'QT' : 'FN'; }
function fdNo(d) { return fdSer(d.kind) + '-' + String(d.date || today()).slice(0, 4) + '-' + ('00' + d.no).slice(-3); }
function fdNext(kind) { var s = fdSer(kind); return (S.fenceDocs || []).filter(function (x) { return fdSer(x.kind) === s; }).reduce(function (a, x) { return Math.max(a, x.no); }, 0) + 1; }
function fdUsed(d) { return (S.fenceDocs || []).some(function (x) { return fdSer(x.kind) === fdSer(d.kind) && x.no === d.no; }); }
function fdNewest(list) { return list.slice().sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; }); }
function fdOf(jobId) { return fdNewest((S.fenceDocs || []).filter(function (x) { return x.jobId === jobId; })); }
function fdById(id) { return (S.fenceDocs || []).filter(function (x) { return x.id === id; })[0]; }
function isFenceJob(j) { return /ຮົ້ວ/.test(j && j.type || ''); }
function fdSum(d) { return (d.items || []).reduce(function (a, it) { return a + (Number(it.qty) || 0) * (Number(it.price) || 0); }, 0); }
function fdCopyItems(items) { return (items || []).map(function (it) { return { name: it.name, mesh: it.mesh || '', size: it.size || '', unit: it.unit || '', qty: it.qty, price: it.price }; }); }
function fdQ(s) { return s ? '\'' + esc(s) + '\'' : 'null'; }
function fdRowHtml(r) {
  return '<div class="eq" onclick="fdReprint(\'' + esc(r.id) + '\')"><span style="flex:1">' + FD_IC[r.kind] + ' ' + esc(FD_T[r.kind]) + ' <b>' + esc(r.id) + '</b><br><span class="muted">' + esc(r.date) + ' · ' + esc(r.customer) + '</span></span>' +
    '<b>' + money(r.kind === 'quote' ? r.total : r.paid) + '</b><span class="badge" style="background:#eef4ff;color:#1d4ed8">🖨️</span></div>';
}
// ປຸ່ມ + ລາຍການເອກະສານ ໃນກາດເງິນຂອງວຽກຮົ້ວ
function fdJobCard(j) {
  return '<div class="row" style="margin-top:8px;gap:6px">' +
    '<button class="btn ghost" style="padding:8px 4px" onclick="openFenceDoc(\'quote\',\'' + esc(j.id) + '\')">📋 ສະເໜີລາຄາ</button>' +
    '<button class="btn ghost" style="padding:8px 4px" onclick="openFenceDoc(\'deposit\',\'' + esc(j.id) + '\')">💵 ມັດຈຳ</button>' +
    '<button class="btn pri" style="padding:8px 4px" onclick="openFenceDoc(\'full\',\'' + esc(j.id) + '\')">🧾 ເກັບເງິນ</button></div>' +
    fdOf(j.id).map(fdRowHtml).join('');
}

// ລາຍການເອກະສານຮົ້ວທັງໝົດ (ເຂົ້າຈາກ ພາບລວມ)
function openFenceList() {
  var docs = fdNewest(S.fenceDocs || []);
  var h = '<div class="shd"><b>🧱 ເອກະສານຮົ້ວ</b><button class="x" onclick="closeSheet()">✕</button></div><div class="sbody">';
  h += '<div class="row" style="gap:6px"><button class="btn gold" onclick="openFenceDoc(\'quote\')">＋ 📋 ໃບສະເໜີລາຄາ</button><button class="btn ghost" onclick="openFenceDoc(\'deposit\')">＋ 💵 ໃບຮັບເງິນ</button></div>';
  h += '<p class="muted" style="margin:8px 0">ອອກຈາກໜ້າວຽກຮົ້ວກໍໄດ້ (ກາດ 💰 ເງິນ) — ເງິນທີ່ຮັບຈະບັນທຶກເຂົ້າວຽກໃຫ້ນຳ</p>';
  if (!docs.length) h += '<div class="empty">ຍັງບໍ່ມີເອກະສານ</div>';
  docs.forEach(function (r) {
    var j = r.jobId ? jobById(r.jobId) : null, jid = fdQ(j ? j.id : '');
    h += '<div class="card" style="padding:8px 10px;margin-bottom:6px">' + fdRowHtml(r) +
      '<div class="row" style="gap:6px;margin-top:4px;flex-wrap:wrap">' +
      (j ? '<button class="btn ghost" style="padding:6px" onclick="openJob(\'' + esc(j.id) + '\')">🔧 ເບິ່ງວຽກ</button>' : '') +
      (r.kind === 'quote' && !j ? '<button class="btn ghost" style="padding:6px" onclick="fdToJob(\'' + esc(r.id) + '\')">➡️ ສ້າງວຽກ</button>' : '') +
      (r.kind === 'quote' ? '<button class="btn ghost" style="padding:6px" onclick="openFenceDoc(\'deposit\',' + jid + ',\'' + esc(r.id) + '\')">💵 ອອກໃບມັດຈຳ</button>' : '') +
      '<button class="btn ghost" style="padding:6px" onclick="openFenceDoc(\'' + r.kind + '\',' + jid + ',\'' + esc(r.id) + '\')">📄 ສຳເນົາ</button>' +
      '</div></div>';
  });
  h += '</div>';
  UI.openId = null; UI.openNote = null; UI.openPO = null;
  $('sheet').innerHTML = h; openSheet(); $('sheet').scrollTop = 0;
}
// ໃບສະເໜີ → ສ້າງວຽກຮົ້ວ (ຜູກໃບກັບວຽກໃຫ້ອັດຕະໂນມັດ)
function fdToJob(id) {
  var r = fdById(id); if (!r) return;
  var tp = S.types.filter(function (t) { return /ຮົ້ວ/.test(t); })[0];
  openForm(null, null, { type: tp, customer: r.customer, phone: r.phone, location: r.address, price: r.total, fromQuote: r.id,
    title: r.items.map(function (it) { return it.name + (it.size ? ' ' + it.size : '') + ' × ' + it.qty + ' ' + (it.unit || ''); }).join('\n') + (r.notes ? '\n' + r.notes : '') });
}

// ຟອມອອກເອກະສານ · kind = quote|deposit|install|full · jobId (ຖ້າມີ) · fromId = ເອົາລາຍການຈາກເອກະສານນີ້
function openFenceDoc(kind, jobId, fromId) {
  var j = jobId ? jobById(jobId) : null, src = fromId ? fdById(fromId) : null;
  if (!src && j) src = fdOf(j.id).filter(function (x) { return x.kind === 'quote'; })[0] || fdOf(j.id)[0] || null; // ໃບສະເໜີຂອງວຽກນີ້
  var last = fdNewest(S.fenceDocs || [])[0], li = last && last.items[0] ? last.items[0] : null;
  var items = src ? fdCopyItems(src.items) : [{ name: li ? li.name : 'ຮົ້ວຕາໜ່າງເຫລັກ ພ້ອມເສົາ', mesh: li ? li.mesh : '9cm*17cm*5mm', size: li ? li.size : '180cm*3m',
    unit: li ? li.unit : 'ຊຸດ', qty: 0, price: li ? li.price : 0 }];
  if (!src && j && j.price && items.length === 1 && !items[0].qty) { items[0].qty = 1; items[0].price = j.price; items[0].name = (j.title || items[0].name).split('\n')[0]; }
  var jid = j ? j.id : (src ? src.jobId || '' : '');
  UI.fdDraft = { kind: '', jobId: jid, date: today(), validDate: ymd(addDays(new Date(), 15)),
    customer: j ? j.customer : src ? src.customer : '', address: j ? j.location : src ? src.address : '', phone: j ? j.phone : src ? src.phone : '',
    items: items, notes: src ? src.notes || '' : '', terms: src && src.terms ? src.terms : FD_TERMS, addPay: !!jid, back: j ? j.id : '' };
  fdSetKind(kind);
  fdRender();
}
// ປ່ຽນປະເພດ → ເລກໃໝ່ (ຖ້າຂ້າມສາຍ) + ຍອດຊຳລະກ່ອນໜ້າ / ຍອດຮັບຄັ້ງນີ້ ຄ່າເລີ່ມ
function fdSetKind(kind) {
  var d = UI.fdDraft, oldSer = d.kind ? fdSer(d.kind) : '';
  d.kind = kind;
  if (fdSer(kind) !== oldSer) d.no = fdNext(kind);
  var j = d.jobId ? jobById(d.jobId) : null, total = fdSum(d);
  d.prevPaid = j ? (j.deposit || 0) + (j.collected || 0) : 0;
  d.paid = kind === 'deposit' ? Math.round(total * 0.5 / 1000) * 1000 : kind === 'full' ? Math.max(0, total - d.prevPaid) : 0;
}
function fdRender() {
  var d = UI.fdDraft, q = d.kind === 'quote';
  var close = d.back ? 'openJob(\'' + esc(d.back) + '\')' : 'openFenceList()';
  var h = '<div class="shd"><b>' + FD_IC[d.kind] + ' ' + FD_T[d.kind] + ' (ຮົ້ວ)</b><button class="x" onclick="' + close + '">✕</button></div><div class="sbody">';
  h += '<div class="stgrid" style="grid-template-columns:repeat(4,1fr)">' + ['quote', 'deposit', 'install', 'full'].map(function (k) {
    return '<button class="stbtn' + (d.kind === k ? ' on' : '') + '" style="' + (d.kind === k ? 'background:#1c2a72;color:#fff' : 'background:#eef1f8;color:#1c2a72') + '" onclick="fdSetKind(\'' + k + '\');fdRender()">' + FD_IC[k] + ' ' + FD_SHORT[k] + '</button>';
  }).join('') + '</div>';
  h += '<div class="row"><div><label class="f">ເລກທີ (ແກ້ໄດ້)</label><input class="inp" inputmode="numeric" value="' + d.no + '" oninput="UI.fdDraft.no=Number(this.value.replace(/[^\\d]/g,\'\'))||0;fdNoTxt()"><div class="muted" id="fdNoTxt" style="font-size:12px"></div></div>' +
    '<div><label class="f">ວັນທີ</label><input class="inp" type="date" value="' + esc(d.date) + '" onchange="UI.fdDraft.date=this.value;fdNoTxt()"></div></div>';
  if (q) h += '<label class="f">ໃຊ້ໄດ້ຮອດວັນທີ</label><input class="inp" type="date" value="' + esc(d.validDate) + '" onchange="UI.fdDraft.validDate=this.value">';
  h += '<label class="f">ຊື່ລູກຄ້າ *</label><input class="inp" value="' + esc(d.customer) + '" placeholder="ທ່ານ / ນາງ / ບໍລິສັດ ..." oninput="UI.fdDraft.customer=this.value">';
  h += '<label class="f">' + (q ? 'ສະຖານທີ່ຕິດຕັ້ງ' : 'ທີ່ຢູ່') + '</label><input class="inp" value="' + esc(d.address) + '" oninput="UI.fdDraft.address=this.value">';
  h += '<label class="f">ຕິດຕໍ່ (ເບີໂທ)</label><input class="inp" inputmode="tel" value="' + esc(d.phone) + '" oninput="UI.fdDraft.phone=this.value">';
  h += '<label class="f">ລາຍການ</label><div id="fdItems"></div><button class="btn ghost full" style="margin-top:6px" onclick="fdAddItem()">＋ ເພີ່ມລາຍການ</button>';
  h += '<label class="f">ໝາຍເຫດ (ຂຶ້ນໃນໃບ · 1 ແຖວ = 1 ຂໍ້)</label><textarea class="inp" rows="2" placeholder="ເຊັ່ນ: ຄວາມຍາວຮົ້ວທັງໝົດ 88 ແມັດ (33 ຊຸດ)" oninput="UI.fdDraft.notes=this.value">' + esc(d.notes) + '</textarea>';
  if (q) h += '<label class="f">ເງື່ອນໄຂການຊຳລະ ແລະ ການຮັບປະກັນ</label><textarea class="inp" rows="5" oninput="UI.fdDraft.terms=this.value">' + esc(d.terms) + '</textarea>';
  else {
    h += '<div class="row"><div><label class="f">ຊຳລະແລ້ວກ່ອນໜ້າ</label><input class="inp" inputmode="numeric" value="' + (d.prevPaid ? money(d.prevPaid) : '') + '" oninput="fmtNum(this);UI.fdDraft.prevPaid=Number(this.value.replace(/[^\\d]/g,\'\'))||0;fdTotals()"></div>' +
      '<div><label class="f">' + (d.kind === 'deposit' ? 'ຮັບເປັນມັດຈຳ *' : 'ຮັບເງິນຄັ້ງນີ້ *') + '</label><input class="inp" id="fdPaid" inputmode="numeric" value="' + (d.paid ? money(d.paid) : '') + '" oninput="fmtNum(this);UI.fdDraft.paid=Number(this.value.replace(/[^\\d]/g,\'\'))||0;fdTotals()"></div></div>';
    if (d.jobId) h += '<label class="eq" style="margin-top:8px"><input type="checkbox" ' + (d.addPay ? 'checked' : '') + ' onchange="UI.fdDraft.addPay=this.checked"><span style="flex:1">ບັນທຶກເງິນນີ້ເຂົ້າວຽກນຳ (' + (d.kind === 'deposit' ? 'ຊ່ອງມັດຈຳ' : 'ເກັບແລ້ວ') + ')</span></label>';
  }
  h += '<div id="fdTotal" class="card" style="margin-top:12px;background:#1c2a72;color:#fff;border:0"></div>';
  h += '<div class="btns"><button class="btn ghost" onclick="' + close + '">ຍົກເລີກ</button><button class="btn gold" onclick="issueFenceDoc()">' + FD_IC[d.kind] + ' ອອກໃບ + ພິມ PDF</button></div>';
  h += '<p class="muted" style="margin-top:8px">ແບບດຽວກັບໃບຂອງ ພູສິຣິ ຕິດຕັ້ງຮົ້ວ (ໂລໂກ້ Phusiri Trading, ບັນຊີ BCEL, ລາຍເຊັນ)</p></div>';
  UI.openId = null; UI.openNote = null; UI.openPO = null;
  $('sheet').innerHTML = h; openSheet();
  fdItems(); fdNoTxt();
}
function fdAddItem() { var d = UI.fdDraft, l = d.items[d.items.length - 1] || {}; d.items.push({ name: '', mesh: l.mesh || '', size: '', unit: l.unit || 'ຊຸດ', qty: 0, price: 0 }); fdItems(); }
function fdNoTxt() { var d = UI.fdDraft, el = $('fdNoTxt'); if (el) el.innerHTML = fdUsed(d) ? '<span style="color:#dc2626">⚠️ ເລກນີ້ອອກແລ້ວ</span>' : esc(fdNo(d)); }
function fdItems() {
  var d = UI.fdDraft, set = function (i, k, num) { return 'UI.fdDraft.items[' + i + '].' + k + '=' + (num ? 'Number(this.value.replace(/[^\\d.]/g,\'\'))||0' : 'this.value') + ';fdTotals()'; };
  $('fdItems').innerHTML = d.items.map(function (it, i) {
    return '<div class="card" style="padding:8px 10px;margin-bottom:6px"><div class="row"><input class="inp" placeholder="ລາຍການສິນຄ້າ" value="' + esc(it.name) + '" oninput="' + set(i, 'name') + '">' +
      (d.items.length > 1 ? '<button class="btn ghost" style="flex:none;padding:4px 10px" onclick="UI.fdDraft.items.splice(' + i + ',1);fdItems()">✕</button>' : '') + '</div>' +
      '<div class="row" style="margin-top:6px"><div><input class="inp" placeholder="ຄວາມຖີ່ຕາໜ່າງ" value="' + esc(it.mesh) + '" oninput="' + set(i, 'mesh') + '"></div>' +
      '<div><input class="inp" placeholder="ສູງ x ກວ້າງ" value="' + esc(it.size) + '" oninput="' + set(i, 'size') + '"></div></div>' +
      '<div class="row" style="margin-top:6px"><div style="flex:0 0 64px"><input class="inp" placeholder="ໜ່ວຍ" value="' + esc(it.unit) + '" oninput="' + set(i, 'unit') + '"></div>' +
      '<div style="flex:0 0 76px"><input class="inp" inputmode="decimal" placeholder="ຈຳນວນ" value="' + (it.qty || '') + '" oninput="' + set(i, 'qty', 1) + '"></div>' +
      '<div><input class="inp" inputmode="numeric" placeholder="ລາຄາ/ກີບ" value="' + (it.price ? money(it.price) : '') + '" oninput="fmtNum(this);' + set(i, 'price', 1) + '"></div></div></div>';
  }).join('');
  fdTotals();
}
function fdTotals() {
  var d = UI.fdDraft, el = $('fdTotal'); if (!el) return;
  var total = fdSum(d), due = Math.max(0, total - (d.prevPaid || 0) - (d.paid || 0));
  el.innerHTML = '<div class="info" style="grid-template-columns:1fr auto;font-size:14px">' +
    '<span style="font-size:16px;color:#f5921e"><b>' + (d.kind === 'quote' ? 'ລວມລາຄາສະເໜີ' : 'ລາຄາທັງໝົດ') + '</b></span><b style="font-size:16px;color:#f5921e">' + money(total) + ' ກີບ</b>' +
    (d.kind === 'quote' ? '' : (d.prevPaid ? '<span>ຊຳລະແລ້ວກ່ອນໜ້າ</span><b>' + money(d.prevPaid) + '</b>' : '') +

    var ph = normPhone(phone); if (ph.length < 7) return '';
    var c = db.customers.filter(function (x) { return x.phone === ph; })[0];
    if (!c) { c = { id: 'CU' + Date.now().toString(36), name: name, phone: ph, address: '', source: source || '', sourceNote: '', pancakeId: '', orders: 0, okOrders: 0, amount: 0, firstOrder: '', lastOrder: '', note: '', createdAt: nowF() }; db.customers.push(c); }
    else if (!c.source && source) c.source = source;
    return c.id;
  }
  function nextInv() { return Math.max(42, db.receipts.reduce(function (a, r) { return Math.max(a, r.no); }, 0)) + 1; }
  function findPO(id) { var p = db.pos.filter(function (x) { return x.id === id; })[0]; if (!p) throw new Error('ບໍ່ພົບໃບສັ່ງ'); return p; }
  function findN(id) { var n = db.notes.filter(function (x) { return x.id === id; })[0]; if (!n) throw new Error('ບໍ່ພົບໂນດ'); return n; }
  function all(c) {
    save(); var o = isOwner(c);
    var jobs = o ? db.jobs : db.jobs.filter(function (j) { return c.jobId && j.id === c.jobId && c.key && c.key === j.shareKey; });
    var notes = o ? db.notes : [], pos = o ? db.pos : [];
    var logs = {}; notes.concat(pos).forEach(function (n) { if (db.logs[n.id]) logs[n.id] = db.logs[n.id]; });
    jobs.forEach(function (j) { if (db.logs[j.id]) logs[j.id] = db.logs[j.id].filter(function (l) { return o || l.action !== 'pay'; }); });
    var ids = {}; jobs.forEach(function (j) { j.techIds.forEach(function (t) { ids[t] = 1; }); });
    return JSON.stringify({
      owner: !!o, notes: notes, types: db.types, sources: o ? (db.sources || MOCK_SRC) : [], reminders: db.reminders, logs: logs,
      pos: pos, products: o ? db.products : [], suppliers: o ? db.suppliers : [],
      receipts: o ? db.receipts : [], nextInvoice: o ? nextInv() : 0, fenceDocs: o ? db.fenceDocs : [],
      instRate: o ? (db.instRate == null ? 250000 : db.instRate) : 0, dayRate: o ? db.dayRate || 350000 : 0, halfRate: o ? db.halfRate || 150000 : 0, calendarId: o ? '(ໂໝດທົດລອງ — ບໍ່ມີ Calendar)' : '', appUrl: '',
      techs: o ? db.techs : db.techs.filter(function (t) { return ids[t.id]; }).map(function (t) { return { id: t.id, name: t.name }; }),
      jobs: jobs.map(function (j) {
        var x = JSON.parse(JSON.stringify(j));
        x.due = j.status === 'cancelled' ? 0 : Math.max(0, j.price - j.deposit - j.collected);
        if (!o) { delete x.price; delete x.deposit; delete x.collected; delete x.due; delete x.shareKey; delete x.instFee; delete x.techPay; delete x.labor; delete x.expenses; }
        return x;
      })
    });
  }
  var LO = { pending: 'ລໍຖ້ານັດ', scheduled: 'ນັດແລ້ວ', progress: 'ກຳລັງເຮັດ', done: 'ສຳເລັດ', postponed: 'ເລື່ອນ', cancelled: 'ຍົກເລີກ' };
  return {
    api_getAll: all,
    api_checkPin: function (c, p) { return String(p) === db.pin; },
    api_saveJob: function (c, d) {
      need(c); var isNew = !d.id;
      var j = isNew ? { id: 'J' + Date.now().toString(36).toUpperCase(), photosBefore: [], photosAfter: [], collected: 0, createdAt: nowF(), shareKey: newKey() } : find(d.id);
      ['type', 'title', 'customer', 'phone', 'location', 'mapUrl', 'date', 'start', 'end', 'status', 'note', 'techIds', 'equipment', 'source'].forEach(function (k) { if (d[k] !== undefined) j[k] = d[k]; });
      if (j.phone) j.customerId = mockCust(j.customer, j.phone, j.source);
      ['price', 'deposit', 'collected', 'points', 'instFee'].forEach(function (k) { if (d[k] !== undefined) j[k] = d[k] || 0; });
      if (d.labor) { j.labor = d.labor; j.techPay = d.labor.reduce(function (a, l) { return a + l.full * (db.dayRate || 350000) + l.half * (db.halfRate || 150000); }, 0); }
      if (j.status === 'pending' && j.date) j.status = 'scheduled';
      j.updatedAt = nowF(); if (isNew) db.jobs.push(j);
      log(j.id, c, isNew ? 'create' : 'edit', isNew ? 'ສ້າງວຽກໃໝ່' : 'ແກ້ໄຂຂໍ້ມູນວຽກ');
      if (d.fromNote) { var fn = findN(d.fromNote); fn.status = fn.cat === 'follow' ? 'won' : 'done'; fn.jobId = j.id; log(fn.id, c, 'job', 'ປ່ຽນເປັນວຽກ ' + j.id); }
      if (d.fromQuote) { var fq = db.fenceDocs.filter(function (x) { return x.id === d.fromQuote; })[0]; if (fq && !fq.jobId) fq.jobId = j.id; }
      return all(c);
    },
    api_deleteJob: function (c, id) { need(c); db.jobs = db.jobs.filter(function (x) { return x.id !== id; }); return all(c); },
    api_setStatus: function (c, id, s) {
      if (s === 'cancelled') need(c);
      var j = find(id, c), o = j.status; j.status = s; j.updatedAt = nowF(); log(id, c, 'status', LO[o] + ' → ' + LO[s]); return all(c);
    },
    api_addNote: function (c, id, t) { if (id.charAt(0) === 'N') { need(c); findN(id); } else find(id, c); log(id, c, 'note', t); return all(c); },
    api_saveNote: function (c, d) {
      need(c); var isNew = !d.id;
      var n = isNew ? { id: 'N' + Date.now().toString(36).toUpperCase(), status: 'open', jobId: '', createdAt: nowF() } : findN(d.id);
      ['cat', 'title', 'customer', 'phone', 'detail', 'remindDate', 'remindTime', 'value', 'source'].forEach(function (k) { if (d[k] !== undefined) n[k] = d[k]; });
      if (!n.title) throw new Error('ກະລຸນາໃສ່ຫົວຂໍ້ໂນດ');
      n.updatedAt = nowF(); if (isNew) db.notes.push(n);
      log(n.id, c, isNew ? 'create' : 'edit', isNew ? 'ສ້າງໂນດ' : 'ແກ້ໄຂໂນດ'); return all(c);
    },
    api_setNoteStatus: function (c, id, s) { need(c); var n = findN(id), o = n.status; n.status = s; n.updatedAt = nowF(); log(id, c, 'status', NST[o].l + ' → ' + NST[s].l); return all(c); },
    api_snoozeNote: function (c, id, days) {
      need(c); var n = findN(id), base = n.remindDate && n.remindDate > today() ? parseYmd(n.remindDate) : new Date();
      n.remindDate = ymd(addDays(base, days)); n.updatedAt = nowF(); log(id, c, 'snooze', 'ເລື່ອນເຕືອນໄປ ' + n.remindDate); return all(c);
    },
    api_issueFenceDoc: function (c, d) {
      need(c); var ser = fdSer(d.kind);
      if (db.fenceDocs.some(function (x) { return fdSer(x.kind) === ser && x.no === d.no; })) throw new Error('ເລກທີ ' + ser + ' ' + d.no + ' ອອກແລ້ວ — ໃຊ້ເລກອື່ນ');
      var items = d.items.filter(function (it) { return String(it.name).trim() && it.qty > 0; }), q = d.kind === 'quote';
      var r = { id: fdNo(d), kind: d.kind, no: d.no, jobId: d.jobId || '', date: d.date, validDate: q ? d.validDate : '', customer: d.customer, address: d.address, phone: d.phone,
        items: items, total: fdSum({ items: items }), prevPaid: q ? 0 : d.prevPaid || 0, paid: q ? 0 : d.paid || 0, notes: d.notes || '', terms: d.terms || '', createdAt: nowF() };
      db.fenceDocs.push(r);
      if (r.jobId) {
        var j = find(r.jobId);
        if (!q && d.addPay) { if (d.kind === 'deposit') j.deposit += r.paid; else j.collected += r.paid; if (!j.price) j.price = r.total; log(j.id, c, 'pay', 'ຮັບເງິນ ' + money(r.paid) + ' ກີບ (' + r.id + ')'); }
        log(j.id, c, 'receipt', FD_IC[r.kind] + ' ອອກ' + FD_T[r.kind] + ' ' + r.id);
      }
      return all(c);
    },
    api_getCRM: function (c) { need(c); return JSON.stringify({ customers: db.customers, sales: db.sales, salesSync: nowF() }); },
    api_syncSales: function (c) { need(c); var o = { customers: db.customers, sales: db.sales, salesSync: nowF(), msg: 'ໂໝດທົດລອງ: ບໍ່ມີອໍເດີໃໝ່' }; return JSON.stringify(o); },
    api_saveCustomer: function (c, d) { need(c); var x = db.customers.filter(function (y) { return y.id === d.id; })[0]; ['name', 'address', 'source', 'sourceNote', 'note'].forEach(function (k) { if (d[k] !== undefined) x[k] = d[k]; }); if (d.phone) x.phone = normPhone(d.phone); save(); return JSON.stringify({ customers: db.customers, sales: db.sales, salesSync: nowF() }); },
    api_getProducts: function (c) { need(c); return JSON.stringify({ products: db.products }); },
    api_addExpense: function (c, id, e) { need(c); var j = find(id); j.expenses = (j.expenses || []).concat([{ id: 'e' + Date.now().toString(36), cat: e.cat, name: e.name, amount: e.amount, date: e.date }]); log(id, c, 'pay', '💸 ລາຍຈ່າຍ: ' + e.name); return all(c); },
    api_delExpense: function (c, id, eid) { need(c); var j = find(id); j.expenses = (j.expenses || []).filter(function (e) { return e.id !== eid; }); return all(c); },
    api_issueReceipt: function (c, d) {
      need(c);
      if (db.receipts.some(function (r) { return r.no === d.no; })) throw new Error('ເລກທີ ' + d.no + ' ອອກໃນແອບແລ້ວ — ໃຊ້ເລກອື່ນ');
      var items = d.items.filter(function (it) { return String(it.name).trim() && it.qty > 0; });
      var sub = items.reduce(function (a, it) { return a + it.qty * it.price; }, 0);
      var r = { no: d.no, jobId: d.jobId, date: d.date, customer: d.customer, address: d.address, phone: d.phone, items: items,
        discount: d.discount || 0, total: Math.max(0, sub - (d.discount || 0)), paid: d.paid || 0, note: d.note || '', createdAt: nowF() };
      db.receipts.push(r); log(d.jobId, c, 'receipt', '🧾 ອອກໃບເກັບເງິນ ' + rcNo(r) + ' · ' + money(r.total) + ' ກີບ'); return all(c);
    },
    api_syncProducts: function (c) { need(c); db.products.forEach(function (p) { p.syncedAt = nowF(); }); return all(c); },
    api_saveSupplier: function (c, d) {
      need(c); var s = d.id ? db.suppliers.filter(function (x) { return x.id === d.id; })[0] : null;
      if (!s) { s = { id: 'S' + Date.now().toString(36), active: true }; db.suppliers.push(s); }
      ['name', 'phone', 'address', 'note'].forEach(function (k) { if (d[k] !== undefined) s[k] = d[k]; });
      if (d.active !== undefined) s.active = !!d.active; return all(c);
    },
    api_savePO: function (c, d) {
      need(c); var isNew = !d.id;
      var p = isNew ? { id: 'PO' + Date.now().toString(36).toUpperCase(), status: 'draft', files: [], pancakeNo: '', createdAt: nowF() } : findPO(d.id);
      if (p.status === 'received') throw new Error('ໃບນີ້ລົງ Pancake ແລ້ວ — ແກ້ລາຍການບໍ່ໄດ້');
      ['supplierId', 'date', 'note', 'shipFee', 'discount', 'paid'].forEach(function (k) { if (d[k] !== undefined) p[k] = d[k]; });
      p.items = JSON.parse(JSON.stringify(d.items)); p.updatedAt = nowF(); if (isNew) db.pos.push(p);
      log(p.id, c, isNew ? 'create' : 'edit', isNew ? 'ສ້າງໃບສັ່ງເຄື່ອງ' : 'ແກ້ໄຂໃບສັ່ງເຄື່ອງ'); return all(c);
    },
    api_payPO: function (c, id, v) { need(c); var p = findPO(id); p.paid = v; log(id, c, 'pay', 'ຈ່າຍຜູ້ສະໜອງແລ້ວລວມ ' + money(v) + ' ກີບ'); return all(c); },
    api_setPOStatus: function (c, id, s) {
      need(c); var p = findPO(id), o = p.status;
      if (o === 'received') throw new Error('ໃບນີ້ລົງ Pancake ແລ້ວ');
      if (s === 'received') { p.pancakeNo = 'DEMO'; p.receivedAt = nowF(); p.items.forEach(function (it) { var pr = db.products.filter(function (x) { return x.vid === it.vid; })[0]; if (pr) { pr.stock += Number(it.qty); pr.cost = it.price; } }); }
      p.status = s; log(id, c, 'status', POST[o].l + ' → ' + POST[s].l + (s === 'received' ? ' · (ໂໝດທົດລອງ: ບໍ່ໄດ້ສົ່ງ Pancake ແທ້)' : '')); return all(c);
    },
    api_deletePO: function (c, id) { need(c); db.pos = db.pos.filter(function (x) { return x.id !== id; }); return all(c); },
    api_uploadPOFile: function (c, id, data, name) { need(c); var p = findPO(id); p.files.push({ id: data, name: name, mime: (data.match(/^data:([^;]+)/) || [])[1] || '' }); return all(c); },
    api_delPOFile: function (c, id, fid) { need(c); var p = findPO(id); p.files = p.files.filter(function (f) { return f.id !== fid; }); return all(c); },
    api_deleteNote: function (c, id) { need(c); db.notes = db.notes.filter(function (x) { return x.id !== id; }); return all(c); },
    api_toggleEquip: function (c, id, i, done) { var j = find(id, c); j.equipment[i].done = done; log(id, c, 'equip', (done ? '☑ ' : '☐ ') + j.equipment[i].t); return all(c); },
    api_recordPay: function (c, id, n) { need(c); var j = find(id); j.collected += n; log(id, c, 'pay', 'ເກັບເງິນໄດ້ ' + money(n) + ' ກີບ'); return all(c); },
    api_shareLink: function (c, id, reset) { need(c); var j = find(id); if (!j.shareKey || reset) j.shareKey = newKey(); if (reset) log(id, c, 'share', 'ປ່ຽນລິ້ງແຊໃໝ່ (ລິ້ງເກົ່າໃຊ້ບໍ່ໄດ້)'); return all(c); },
    api_uploadPhoto: function (c, id, kind, data) {
      var j = find(id, c); (kind === 'before' ? j.photosBefore : j.photosAfter).push(data);
      log(id, c, 'photo', 'ໃສ່ຮູບ' + (kind === 'before' ? 'ກ່ອນ' : 'ຫຼັງ') + 'ຕິດຕັ້ງ'); return all(c);
    },
    api_delPhoto: function (c, id, kind, p) {
      need(c); var j = find(id), k = kind === 'before' ? 'photosBefore' : 'photosAfter';
      j[k] = j[k].filter(function (x) { return x !== p; }); return all(c);
    },
    api_saveSettings: function (c, o) {
      need(c);
      if (o.types && o.types.length) db.types = o.types;
      if (o.reminders) db.reminders = o.reminders;
      if (o.techs) db.techs = o.techs.map(function (t) { return { id: t.id || ('t' + Date.now() + Math.floor(Math.random() * 999)), name: t.name, phone: t.phone || '', email: t.email || '', active: t.active !== false }; });
      if (o.newPin) db.pin = String(o.newPin);
      ['instRate', 'dayRate', 'halfRate'].forEach(function (k) { if (o[k] !== undefined) db[k] = o[k]; });
      return all({ pin: o.newPin || c.pin, who: c.who });
    }
  };
})();

/* ================= ເລີ່ມ ================= */
if (MODE === 'demo') $('demoBar').style.display = '';
function deepLink(cb) {
  if (MODE === 'gas' && google.script.url) google.script.url.getLocation(function (l) { cb(l.parameter || {}); });
  else {
    var p = {}; location.search.replace(/[?&]([^=&]+)=([^&]*)/g, function (_, k, v) { p[k] = decodeURIComponent(v); });
    cb(p);
  }
}
deepLink(function (p) {
  if (p.job && p.k) LINK = { job: p.job, k: p.k };
  // ບໍ່ມີລິ້ງ ແລະ ບໍ່ແມ່ນເຈົ້າຂອງ → ຂຶ້ນ 🔒 ທັນທີ ບໍ່ຕ້ອງລໍເຊີບເວີ
  if (!LINK && !isOwnerMe()) { UI.loaded = true; render(); return; }
  $('app').innerHTML = '<div class="who"><div class="spin" style="margin:30px auto 14px"></div><p>ກຳລັງໂຫຼດວຽກ...<br>ຄັ້ງທຳອິດຂອງມື້ອາດໃຊ້ 10-30 ວິນາທີ</p></div>';
  call('api_getAll').then(function (d) {
    busy(false); UI.loaded = true; apply(d);
    if (p.job && isOwnerMe() && jobById(p.job)) openJob(p.job);
  }).catch(function (e) { busy(false); $('app').innerHTML = '<div class="empty">⚠️ ໂຫຼດຂໍ້ມູນບໍ່ໄດ້: ' + esc(e && e.message ? e.message : e) + '</div>'; });
});
// ດຶງຂໍ້ມູນໃໝ່ທຸກ 60 ວິນາທີ ເວລາເປີດແອບຢູ່ (ເຫັນທີ່ຄົນອື່ນອັບເດດ)
setInterval(function () {
  if (document.visibilityState === 'visible' && UI.loaded && !INFLIGHT && (LINK ? ME : isOwnerMe()) && !$('loading').classList.contains('on') && !$('sheet').classList.contains('on')) {
    call('api_getAll').then(apply).catch(function () {});
  }
}, 60000);
</script>
