<!doctype html>
<html lang="lo"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>DEMO · ແອັບຕາຕະລາງວຽກ ແບບ A + C</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF7E8;--card:#fff;--ink:#2B2A33;--mut:#8B8793;--or:#F5921E;--bl:#2F6BFF;--gr:#14A86B;--pu:#7A4DFF;--pk:#FF4D8D;--ye:#F5B800;--rd:#E5484D}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#E9E1D0;font-family:'Noto Sans Lao','Phetsarath OT','Saysettha OT',system-ui,sans-serif;color:var(--ink)}
#app{position:relative;width:100%;max-width:430px;height:100%;margin:0 auto;background:var(--bg);overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.18)}
.demo{background:#FFF1C9;color:#8a5a00;font-size:12px;text-align:center;padding:5px 8px;font-weight:700}
.pg{position:absolute;left:0;right:0;top:25px;bottom:84px;overflow-y:auto;padding:14px 16px 24px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.av{width:46px;height:46px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 3px 10px rgba(245,146,30,.25);flex:none}
.hd h1{font-size:21px;font-weight:800;line-height:1.2}.hd p{font-size:13px;color:var(--mut)}
.back{width:44px;height:44px;border-radius:15px;background:#fff;display:grid;place-items:center;font-size:24px;box-shadow:0 2px 8px rgba(80,60,20,.12);border:0;cursor:pointer;flex:none}
.next{background:var(--ink);color:#fff;border-radius:26px;padding:15px 16px;display:flex;align-items:center;gap:12px;margin-bottom:14px;cursor:pointer}
.next .e{font-size:38px}.next small{font-size:12px;opacity:.7;display:block}.next h3{font-size:17px;font-weight:700;line-height:1.3}.next .tm{margin-left:auto;font-size:25px;font-weight:800;color:#FFC857;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:28px;padding:14px;height:150px;color:#fff;position:relative;box-shadow:0 10px 20px rgba(80,60,20,.18);display:flex;flex-direction:column;justify-content:flex-end;text-align:left;cursor:pointer;font-family:inherit;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile .e{position:absolute;left:14px;top:8px;font-size:54px;line-height:1.2;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.tile h2{font-size:25px;font-weight:800;line-height:1.1}.tile p{font-size:12px;opacity:.93;margin-top:2px}
.tile i{position:absolute;right:12px;top:12px;background:#fff;color:var(--ink);font-style:normal;font-weight:800;font-size:15px;border-radius:99px;min-width:30px;height:30px;display:grid;place-items:center;padding:0 8px}
.tile i.alert{background:var(--rd);color:#fff}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.seg button{border:0;background:#fff;border-radius:18px;padding:12px 0;font:700 16px inherit;font-family:inherit;color:var(--mut);box-shadow:0 2px 8px rgba(80,60,20,.08);cursor:pointer}.seg .on{background:var(--bl);color:#fff;box-shadow:0 8px 16px rgba(47,107,255,.35)}
.job{background:var(--card);border-radius:24px;padding:13px;margin-bottom:11px;display:flex;gap:12px;box-shadow:0 4px 14px rgba(80,60,20,.09);position:relative;overflow:hidden;cursor:pointer;align-items:center}
.job:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c)}
.job .tm{width:74px;flex:none;margin-left:6px;text-align:center;background:var(--c);color:#fff;border-radius:18px;padding:8px 0}.job .tm b{display:block;font-size:21px;font-weight:800;line-height:1}.job .tm span{font-size:11px;opacity:.92}
.job h3{font-size:15.5px;font-weight:700;line-height:1.35}.job p{font-size:12.5px;color:var(--mut);margin-top:2px}
.chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 10px;margin-top:4px}
.s-scheduled{background:#E6EFFF;color:#2F6BFF}.s-progress{background:#FFEBCB;color:#B45F00}.s-done{background:#E3F7EE;color:var(--gr)}.s-late{background:#FFE5E6;color:var(--rd)}
.empty{text-align:center;color:var(--mut);padding:30px 10px;font-size:15px}
.nav{position:absolute;left:10px;right:10px;bottom:12px;background:#fff;border-radius:28px;display:flex;padding:7px 5px;box-shadow:0 10px 30px rgba(80,60,20,.2);z-index:5}
.nav button{flex:1;border:0;background:none;text-align:center;font:600 11px inherit;font-family:inherit;color:var(--mut);padding:4px 0;border-radius:20px;cursor:pointer}.nav button b{display:block;font-size:23px;line-height:1.2;filter:grayscale(1);opacity:.55}
.nav .on{color:var(--or);background:#FFF1DC}.nav .on b{filter:none;opacity:1}
.big{display:flex;align-items:center;gap:14px;border:0;width:100%;text-align:left;font-family:inherit;color:#fff;border-radius:26px;padding:16px 18px;margin-bottom:12px;box-shadow:0 8px 18px rgba(80,60,20,.18);cursor:pointer}
.big .e{font-size:40px}.big b{font-size:19px;font-weight:800;display:block}.big span{font-size:12.5px;opacity:.92}
.sec{font-size:16px;font-weight:800;margin:14px 2px 9px}
.num{border-radius:28px;padding:16px 18px;margin-bottom:12px;color:#fff;display:flex;align-items:center;gap:14px;box-shadow:0 8px 20px rgba(80,60,20,.18)}
.num .e{font-size:44px}.num b{font-size:38px;font-weight:800;line-height:1;display:block}.num span{font-size:15px;font-weight:700}.num small{font-size:12px;opacity:.9;display:block}
.row{background:#fff;border-radius:20px;padding:12px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 10px rgba(80,60,20,.08)}
.row h4{font-size:15px;font-weight:700}.row p{font-size:12px;color:var(--mut)}.row .r{margin-left:auto;text-align:right}
.btn{border:0;font-family:inherit;font-weight:800;font-size:15px;border-radius:16px;padding:9px 14px;color:#fff;background:var(--gr);cursor:pointer}
.btn.l{display:block;width:100%;font-size:18px;padding:14px;border-radius:20px;box-shadow:0 6px 14px rgba(20,168,107,.3)}
.btn.o{background:var(--or)}.btn.g{background:#EDE6D6;color:var(--ink)}
input[type=text],input[type=number]{width:100%;border:2px solid #EADFC8;border-radius:16px;padding:12px 14px;font:600 16px inherit;font-family:inherit;background:#fff;margin-bottom:10px}
.sheetbg{position:absolute;inset:0;background:rgba(30,25,15,.45);z-index:8;display:none}.sheetbg.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:#fff;border-radius:30px 30px 0 0;padding:18px 18px 22px;z-index:9;transform:translateY(105%);transition:transform .25s}.sheet.on{transform:none}
.sheet h2{font-size:20px;font-weight:800;margin-bottom:8px}
.kv{display:flex;justify-content:space-between;font-size:14.5px;padding:6px 0;border-bottom:1px solid #F3ECDD}.kv span{color:var(--mut)}
.pbtn{display:flex;align-items:center;gap:8px;background:#FFF7E8;border-radius:16px;padding:9px 12px;margin-bottom:8px}.pbtn span{flex:1;font-size:14.5px;font-weight:600}.pbtn small{display:block;color:var(--mut);font-size:12px;font-weight:400}
.q{width:34px;height:34px;border-radius:12px;border:0;background:#fff;font-size:20px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.12);cursor:pointer}.qn{min-width:24px;text-align:center;font-weight:800}
.tot{background:var(--ink);color:#fff;border-radius:20px;padding:14px 16px;margin:12px 0}.tot div{display:flex;justify-content:space-between;font-size:14px;padding:2px 0}.tot .g{font-size:20px;font-weight:800;color:#FFC857;padding-top:6px}
.tg{display:flex;gap:8px;margin:8px 0 4px}.tg button{flex:1;border:2px solid #EADFC8;background:#fff;border-radius:16px;padding:10px 4px;font:700 13.5px inherit;font-family:inherit;color:var(--mut);cursor:pointer}.tg .on{border-color:var(--or);background:#FFF1DC;color:var(--or)}
#toast{position:absolute;left:50%;top:40px;transform:translate(-50%,-80px);background:var(--ink);color:#fff;border-radius:99px;padding:10px 20px;font-weight:700;font-size:14px;z-index:20;transition:transform .3s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}#toast.on{transform:translate(-50%,0)}
.ck{width:30px;height:30px;border-radius:10px;border:3px solid #D9CDB4;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;cursor:pointer}.ck.on{background:var(--gr);border-color:var(--gr)}
.done-t{text-decoration:line-through;color:var(--mut)}

.ovb{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:26px;padding:13px 16px;margin-bottom:12px;color:#fff;font-family:inherit;text-align:left;cursor:pointer;background:linear-gradient(135deg,#2B2A33,#4a4660);box-shadow:0 8px 18px rgba(80,60,20,.2)}
.ovb .e{font-size:34px}.ovb b{font-size:19px;font-weight:800;display:block}.ovb span{font-size:12.5px;opacity:.85}.ovb em{margin-left:auto;font-style:normal;font-size:22px;opacity:.7}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:6px}.hc{background:#fff;border-radius:24px;padding:14px 14px 12px;box-shadow:0 4px 14px rgba(80,60,20,.09);border-top:6px solid var(--c)}
.hc b{display:block;font-size:30px;font-weight:800;line-height:1.1;color:var(--c)}.hc span{font-size:13px;color:var(--mut);font-weight:600}.hc small{display:block;font-size:11.5px;color:var(--mut);margin-top:2px}
.al{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}.al button{border:0;border-radius:99px;padding:8px 14px;font:700 13.5px inherit;font-family:inherit;cursor:pointer}
.bars{background:#fff;border-radius:24px;padding:14px 16px;box-shadow:0 4px 14px rgba(80,60,20,.09)}
.br{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13px}.br>span:first-child{width:62px;flex:none;color:var(--mut);font-weight:600}.br .tr{flex:1;height:14px;background:#F6EEDC;border-radius:99px;overflow:hidden}.br .tr i{display:block;height:100%;border-radius:99px;background:var(--c)}.br b{width:34px;text-align:right;flex:none}
</style></head><body>
<div id="app">
 <div class="demo">🧪 DEMO · ຂໍ້ມູນຕົວຢ່າງ · ບໍ່ກະທົບແອັບຈິງ</div>
 <div class="pg" id="pg"></div>
 <nav class="nav" id="nav"></nav>
 <div class="sheetbg" id="bg" onclick="closeSheet()"></div><div class="sheet" id="sheet"></div>
 <div id="toast"></div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function off(n){var d=new Date();d.setDate(d.getDate()+n);return ymd(d)}
var DOW=['ອາທິດ','ຈັນ','ອັງຄານ','ພຸດ','ພະຫັດ','ສຸກ','ເສົາ'],MON=['ມັງກອນ','ກຸມພາ','ມີນາ','ເມສາ','ພຶດສະພາ','ມິຖຸນາ','ກໍລະກົດ','ສິງຫາ','ກັນຍາ','ຕຸລາ','ພະຈິກ','ທັນວາ'];
var TYPE={light:{e:'💡',c:'#2F6BFF'},rent:{e:'🔆',c:'#F5921E'},fence:{e:'🧱',c:'#14A86B'},survey:{e:'🔍',c:'#7A4DFF'}};
var jobs=[
 {id:1,d:off(0),s:'08:30',e:'11:30',t:'light',ti:'ຕິດໄຟສາດ 600W 4 ດວງ',c:'ລູກຄ້າຕົວຢ່າງ 1',ph:'020 1111 0001',pl:'ບ້ານໂພນຕ້ອງ · ຈັນທະບູລີ',price:4200000,paid:1000000,st:'scheduled'},
 {id:2,d:off(0),s:'13:30',e:'17:00',t:'rent',ti:'ເຊົ່າດອກໄຟ ງານບຸນ',c:'ລູກຄ້າຕົວຢ່າງ 2',ph:'020 1111 0002',pl:'ບ້ານດົງໂດກ · ໄຊທານີ',price:6500000,paid:3000000,st:'progress'},
 {id:3,d:off(-2),s:'08:00',e:'11:00',t:'survey',ti:'ສຳຫຼວດໜ້າງານ (ໄຟບໍ່ຕິດ 1 ດວງ)',c:'ລູກຄ້າຕົວຢ່າງ 5',ph:'020 1111 0005',pl:'ບ້ານໜອງບົງ',price:0,paid:0,st:'scheduled'},
 {id:4,d:off(1),s:'09:00',e:'10:00',t:'fence',ti:'ໄປວັດໜ້າງານ ໄຟຖະໜົນ 8 ຕົ້ນ',c:'ລູກຄ້າຕົວຢ່າງ 3',ph:'020 1111 0003',pl:'ບ້ານສີໄຄ · ສີໂຄດຕະບອງ',price:0,paid:0,st:'scheduled'},
 {id:5,d:off(3),s:'08:00',e:'11:00',t:'light',ti:'ໄຟຖະໜົນ 800W × 3',c:'ລູກຄ້າຕົວຢ່າງ 4',ph:'020 1111 0004',pl:'ບ້ານນາໄຊ · ນາຊາຍທອງ',price:5400000,paid:2000000,st:'scheduled'},
 {id:6,d:off(9),s:'08:00',e:'12:00',t:'rent',ti:'ເຊົ່າດອກໄຟ 17 ດອກ',c:'ລູກຄ້າຕົວຢ່າງ 6',ph:'020 1111 0006',pl:'ເມືອງປາກງື່ມ',price:4800000,paid:0,st:'scheduled'}];
var stock=[{n:'ໄຟສາດ 600W',p:990000,q:1},{n:'ໄຟຖະໜົນ All-in-One 600W',p:1490000,q:1},{n:'ໄຟຖະໜົນ 800W',p:1690000,q:6},{n:'ໄຟສວນ 100W',p:420000,q:14},{n:'ເສົາໂຄ້ງ 0.7 ມ (ຂໍ້ຕໍ່)',p:180000,q:0},{n:'ແບັດເຕີຣີ 12V',p:650000,q:9}];
var custs=[['ລູກຄ້າຕົວຢ່າງ 1','020 1111 0001','ບ້ານໂພນຕ້ອງ'],['ລູກຄ້າຕົວຢ່າງ 2','020 1111 0002','ບ້ານດົງໂດກ'],['ລູກຄ້າຕົວຢ່າງ 3','020 1111 0003','ບ້ານສີໄຄ'],['ລູກຄ້າຕົວຢ່າງ 4','020 1111 0004','ບ້ານນາໄຊ'],['ລູກຄ້າຕົວຢ່າງ 6','020 1111 0006','ເມືອງປາກງື່ມ']];
var notes=[{t:'ສັ່ງສະຕັອກ 600W ເພີ່ມ 20 ດວງ',done:false,imp:true},{t:'ສົນໃຈຊຸດໂຊລ່າ 3000W ຂໍໃບສະເໜີລາຄາ',done:false},{t:'ໄຟຖະໜົນ 5 ຕົ້ນ ລໍຖ້າລູກຄ້າເທພື້ນ',done:false}];
var bills=[{c:'ລູກຄ້າຕົວຢ່າງ 7',t:1980000,paid:1500000},{c:'ລູກຄ້າຕົວຢ່າງ 8',t:3200000,paid:3200000}];
var sales=9400000,view='home',seg='today',cust='',stq='';
function money(n){return Math.round(n).toLocaleString('en-US')}
function short(n){return n>=1e6?(Math.round(n/1e5)/10)+'M':money(n)}
function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){e.classList.remove('on')},2200)}
function due(){var a=0;jobs.forEach(function(j){a+=Math.max(0,j.price-j.paid)});bills.forEach(function(b){a+=b.t-b.paid});return a}
function todayJobs(){return jobs.filter(function(j){return j.d===off(0)})}
function lateJobs(){return jobs.filter(function(j){return j.d<off(0)&&j.st!=='done'})}
function stLabel(j){return j.st==='done'?['ສຳເລັດ','s-done']:j.st==='progress'?['ກຳລັງເຮັດ','s-progress']:(j.d<off(0)?['ເລີຍກຳນົດ','s-late']:['ນັດແລ້ວ','s-scheduled'])}
function go(v){view=v;$('pg').scrollTop=0;render()}
function render(){
 var tabs=[['home','🏠','ມື້ນີ້'],['jobs','🔧','ວຽກ'],['sell','🛒','ຂາຍ'],['stock','📦','ຂອງ'],['money','💰','ເງິນ']];
 var navOn=({home:'home',over:'home',jobs:'jobs',sell:'sell',cust:'sell',stock:'stock',money:'money',notes:'home'})[view];
 $('nav').innerHTML=tabs.map(function(t){return '<button class="'+(navOn===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><b>'+t[1]+'</b>'+t[2]+'</button>'}).join('');
 $('pg').innerHTML=({home:vHome,over:vOver,jobs:vJobs,sell:vSell,cust:vCust,stock:vStock,money:vMoney,notes:vNotes})[view]();
}

function ovData(){var t=off(0),days=[];for(var i=0;i<7;i++){var d=new Date();d.setDate(d.getDate()+i);days.push({l:i===0?'ມື້ນີ້':i===1?'ມື້ອື່ນ':DOW[d.getDay()]+' '+d.getDate(),n:jobs.filter(function(j){return j.d===off(i)}).length})}
 var late=jobs.filter(function(j){return j.d<t&&j.st!=='done'}).length,low=stock.filter(function(s){return s.q<=1}).length,nt=notes.filter(function(n){return !n.done}).length,tj=jobs.filter(function(j){return j.d===t});
 var m=new Date().getMonth(),mons=[];for(var k=3;k>=1;k--){var mm=(m-k+12)%12;mons.push([MON[mm].slice(0,6),[6.8,8.1,7.3][3-k]])}mons.push([MON[m].slice(0,6),Math.round(sales/1e5)/10]);
 return {days:days,late:late,low:low,nt:nt,tj:tj,mons:mons,profit:2000000}}

function vOver(){var o=ovData(),mx=Math.max.apply(null,o.days.map(function(d){return d.n}).concat([1])),mm=Math.max.apply(null,o.mons.map(function(m){return m[1]}));
 var h=back('ພາບລວມ','📊')+'<div class="hg">'
 +'<div class="hc" style="--c:#14A86B"><span>ຂາຍເດືອນນີ້</span><b>'+short(sales)+'</b><small>'+(bills.length+1)+' ບິນ</small></div>'
 +'<div class="hc" style="--c:#E5484D"><span>ຄ້າງເກັບ</span><b>'+short(due())+'</b><small>ວຽກ + ບິນ</small></div>'
 +'<div class="hc" style="--c:#7A4DFF"><span>ກຳໄລເດືອນນີ້</span><b>'+short(o.profit)+'</b><small>ຕົວຢ່າງ</small></div>'
 +'<div class="hc" style="--c:#2F6BFF"><span>ວຽກມື້ນີ້</span><b>'+o.tj.length+'</b><small style="color:'+(o.late?'#E5484D':'')+'">'+(o.late?'+ '+o.late+' ເລີຍກຳນົດ':'ບໍ່ມີເລີຍກຳນົດ')+'</small></div></div>'
 +'<div class="sec">ຕ້ອງເຮັດດຽວນີ້</div><div class="al">'
 +(o.late?'<button style="background:#FFE5E6;color:#E5484D" onclick="go(\'jobs\')">⚠️ '+o.late+' ວຽກເລີຍກຳນົດ</button>':'')
 +(o.nt?'<button style="background:#FFF0D9;color:#B45F00" onclick="go(\'notes\')">📝 '+o.nt+' ໂນດຕິດຕາມ</button>':'')
 +(o.low?'<button style="background:#E6EFFF;color:#2F6BFF" onclick="go(\'stock\')">📦 '+o.low+' ສິນຄ້າໃກ້ໝົດ</button>':'')
